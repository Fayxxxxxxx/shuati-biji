<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WangFly的刷题笔记</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #f0f2f5;
    --sidebar-bg: #ffffff;
    --main-bg: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --primary: #4f46e5;
    --primary-light: #eef2ff;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
  }

  /* 整体布局 */
  .app { display: flex; height: 100vh; }

  /* 侧边栏 */
  .sidebar {
    width: 220px; min-width: 220px; background: var(--sidebar-bg);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    font-weight: 700; font-size: 15px; text-align: center; flex-shrink: 0;
  }
  .sidebar-header .icon { font-size: 20px; margin-right: 4px; }
  .sidebar-months { flex: 1; overflow-y: auto; padding: 8px; min-height: 0; }

  /* 侧边栏底部 —— 签到 + 勋章 */
  .sidebar-footer {
    flex-shrink: 0; border-top: 1px solid var(--border);
    padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .sf-checkin-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 4px;
  }
  .sf-checkin-title { font-size: 11px; font-weight: 600; color: #52525b; }
  .sf-month-arrow { cursor: pointer; color: #a1a1aa; font-size: 10px; user-select: none; }
  .sf-month-arrow:hover { color: #6366f1; }
  .sf-checkin-streak { font-size: 10px; font-weight: 600; color: #c9a96e; }
  .sf-heatmap { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
  .sf-heatmap-row { display: flex; gap: 2px; }
  .sf-heatmap-day {
    width: 11px; height: 11px; border-radius: 2px;
    background: #ebedf0; flex-shrink: 0; position: relative;
  }
  .sf-heatmap-day.placeholder { background: transparent; }
  .sf-heatmap-day.checked.l1 { background: #c7d2fe; }
  .sf-heatmap-day.checked.l2 { background: #a5b4fc; }
  .sf-heatmap-day.checked.l3 { background: #818cf8; }
  .sf-heatmap-day.checked.l4 { background: #6366f1; }
  .sf-heatmap-day.checked.l5 { background: #4f46e5; }
  .sf-heatmap-day.today { outline: 1.5px solid #6366f1; outline-offset: 1px; }
  .sf-heatmap-day[data-tip]:hover::after {
    content: attr(data-tip); position: absolute;
    bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%);
    background: #1a1a2e; color: #f0f2f5; font-size: 10px;
    padding: 3px 8px; border-radius: 4px; white-space: nowrap;
    z-index: 100; pointer-events: none;
  }
  /* 侧边栏勋章入口 */
  .sf-badge {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border-radius: 8px; cursor: pointer; transition: all .15s;
    background: #fafafa; border: 1px solid #f0f0f0;
  }
  .sf-badge:hover { background: #fffbeb; border-color: #e8d5a0; }
  .sf-badge-icon {
    width: 26px; height: 26px; border-radius: 50%;
    background: #f5f5f5; border: 1.5px solid #e5e5e5;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .sf-badge-icon.has-badge { background: #fffbeb; border-color: #c9a96e; }
  .sf-badge-icon svg { width: 15px; height: 15px; display: block; }
  .sf-badge-icon.has-badge svg [stroke] { stroke: #8b6914; }
  .sf-badge-icon.has-badge svg [fill] { fill: #8b6914; }
  .sf-badge-text { font-size: 11px; color: #8b6914; font-weight: 600; }

  .month-group { margin-bottom: 12px; }
  .month-label {
    font-size: 12px; font-weight: 600; color: var(--text-secondary);
    padding: 4px 8px; margin-bottom: 2px;
  }
  .day-row {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 8px; border-radius: 6px; cursor: pointer;
    font-size: 13px; transition: background .15s; position: relative;
  }
  .day-row:hover { background: var(--primary-light); }
  .day-row.active { background: var(--primary); color: #fff; font-weight: 600; }
  .day-row.active .day-week { color: rgba(255,255,255,0.7); }
  .day-row.has-note {
    background: #eef2ff;
    font-weight: 600;
  }
  .day-row.has-note.active { background: var(--primary); }
  .day-row .day-num { width: 22px; text-align: right; flex-shrink: 0; }
  .day-row .day-week { font-size: 11px; color: var(--text-secondary); flex-shrink: 0; }
  .day-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    background: transparent; transition: background .15s;
  }
  .day-row.has-note .day-dot { background: var(--primary); }
  .day-row.active .day-dot { background: #fff; }

  /* 全局悬浮提示 */
  .global-tip {
    display: none; position: fixed; z-index: 9999;
    background: #1e293b; color: #f1f5f9; font-size: 12px;
    padding: 8px 12px; border-radius: 6px; max-width: 280px; line-height: 1.5;
    white-space: normal; word-break: break-word; font-weight: 400;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25); pointer-events: none;
  }

  /* 主区域 */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* 顶部栏 */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px; background: var(--main-bg);
    border-bottom: 1px solid var(--border); gap: 12px;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .nav-btn {
    width: 32px; height: 32px; border: 1px solid var(--border);
    border-radius: 6px; background: #fff; cursor: pointer;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
    transition: all .15s; color: var(--text);
  }
  .nav-btn:hover { background: var(--primary-light); border-color: var(--primary); }
  .date-display { font-weight: 700; font-size: 15px; min-width: 160px; text-align: center; }
  .btn-today {
    font-size: 12px; padding: 5px 12px; border: 1px solid var(--border);
    border-radius: 6px; background: #fff; cursor: pointer; transition: all .15s;
  }
  .btn-today:hover { background: var(--primary-light); border-color: var(--primary); }

  .topbar-right { display: flex; align-items: center; gap: 8px; }
.topbar-search { position: relative; flex: 1; max-width: 340px; }
.search-input {
  width: 100%; padding: 7px 14px; border: 1px solid #d1d5db;
  border-radius: 8px; font-size: 13px; outline: none; font-family: inherit;
  background: #f9fafb; transition: all .2s;
}
.search-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
.search-dropdown {
  position: absolute; top: 100%; left: 0; right: 0;
  background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: 320px; overflow-y: auto;
  z-index: 9999; margin-top: 6px;
}
.search-item {
  display: block; padding: 10px 14px; cursor: pointer; transition: background .1s;
  border-bottom: 1px solid #f3f4f6; text-decoration: none; color: inherit;
}
.search-item:last-child { border-bottom: none; }
.search-item:hover { background: #eef2ff; }
.search-item .si-title { font-size: 13px; font-weight: 600; color: #1a1a2e; }
.search-item .si-date { font-size: 11px; color: #9ca3af; margin-top: 2px; }
.search-item .si-tags { font-size: 10px; color: #6b7280; margin-top: 2px; }
.search-item .si-tags span {
  display: inline-block; padding: 1px 6px; border-radius: 3px;
  background: #f3f4f6; margin-right: 4px;
}
.search-empty { padding: 16px; text-align: center; color: #9ca3af; font-size: 13px; }
  .save-status { font-size: 12px; color: var(--text-secondary); }
  .btn-export {
    font-size: 12px; padding: 6px 14px; border: none; border-radius: 6px;
    background: var(--primary); color: #fff; cursor: pointer; font-weight: 600;
    transition: filter .15s;
  }
  .btn-export:hover { filter: brightness(1.15); }
  .btn-import {
    font-size: 12px; padding: 6px 14px; border: 1px solid var(--border);
    border-radius: 6px; background: #fff; cursor: pointer; font-weight: 600;
    transition: all .15s; color: var(--text);
  }
  .btn-import:hover { background: var(--primary-light); border-color: var(--primary); }
  .btn-import.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* 导入面板 */
  .import-panel {
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 14px 20px; display: flex; flex-direction: column; gap: 8px;
  }
  .import-row { display: flex; gap: 8px; align-items: center; }
  .import-row input[type="text"] {
    flex: 1; padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; outline: none;
  }
  .import-row input[type="text"]:focus { border-color: var(--primary); }
  .import-row select {
    padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; outline: none; background: #fff;
  }
  .platform-badge {
    padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: 700;
    color: #fff; white-space: nowrap; min-width: 40px; text-align: center;
  }
  .platform-badge.leet { background: #f59e0b; }
  .platform-badge.luogu { background: #3498db; }
  .platform-badge.cf { background: #e74c3c; }
  .platform-badge.atc { background: #8e44ad; }
  .platform-badge.nc { background: #2ecc71; }
  .platform-badge.unknown { background: #95a5a6; }
  .btn-import-go {
    padding: 8px 18px; border: none; border-radius: 6px;
    background: var(--primary); color: #fff; font-weight: 600;
    font-size: 13px; cursor: pointer; transition: filter .15s;
    white-space: nowrap;
  }
  .btn-import-go:hover { filter: brightness(1.15); }
  .import-status {
    font-size: 12px; white-space: nowrap;
  }
  .import-status.ok { color: #10b981; }
  .import-status.err { color: #f59e0b; }
  #importProblem {
    width: 100%; border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; font-size: 13px; line-height: 1.6;
    outline: none; resize: vertical; font-family: inherit;
  }
  #importProblem:focus { border-color: var(--primary); }
  #importCode {
    width: 100%; border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; font-family: "JetBrains Mono", "Consolas", monospace;
    font-size: 13px; line-height: 1.5; outline: none; resize: vertical;
  }
  #importCode:focus { border-color: var(--primary); }
  .word-count { font-size: 12px; color: var(--text-secondary); }

  /* 编辑+预览区 */
  .editor-area { flex: 1; display: flex; overflow: hidden; }

  .pane {
    flex: 1; display: flex; flex-direction: column;
    min-width: 0; overflow: hidden;
  }
  .pane-left { border-right: none; }
  .pane-right { border-left: none; }

  /* 可拖拽分隔条 */
  .resizer {
    width: 6px; min-width: 6px; cursor: col-resize;
    background: var(--border); transition: background .15s;
    position: relative; z-index: 10;
  }
  .resizer:hover, .resizer.active {
    background: var(--primary);
  }
  .pane-header {
    padding: 8px 16px; font-size: 12px; font-weight: 600;
    color: var(--text-secondary); border-bottom: 1px solid var(--border);
    background: #fafbfc; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .pane-body { flex: 1; overflow-y: auto; padding: 16px; }

  /* Markdown 编辑器 */
  #editor {
    width: 100%; height: 100%; border: none; outline: none;
    resize: none; font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
    font-size: 14px; line-height: 1.7; color: var(--text);
    background: transparent;
  }
  #editor::placeholder { color: #c0c4cc; }

  /* Markdown 预览 */
  .preview-content { max-width: 100%; word-break: break-word; }
  .preview-content h1 { font-size: 1.5em; margin: 16px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .preview-content h2 { font-size: 1.25em; margin: 14px 0 6px; }
  .preview-content h3 { font-size: 1.1em; margin: 12px 0 4px; }
  .preview-content p { margin: 6px 0; line-height: 1.7; }
  .preview-content code {
    background: #f1f5f9; padding: 2px 6px; border-radius: 4px;
    font-family: "JetBrains Mono", "Fira Code", "Consolas", monospace;
    font-size: 0.88em;
  }
  .preview-content pre {
    background: #1e293b; color: #e2e8f0; padding: 14px 16px;
    border-radius: 8px; overflow-x: auto; margin: 10px 0;
    line-height: 1.5;
  }
  .preview-content pre code { background: none; padding: 0; color: inherit; font-size: 13px; }
  .preview-content ul, .preview-content ol { padding-left: 20px; margin: 6px 0; }
  .preview-content li { margin: 2px 0; line-height: 1.6; }
  .preview-content blockquote {
    border-left: 3px solid var(--primary); padding: 4px 12px; margin: 8px 0;
    color: var(--text-secondary); background: var(--primary-light);
    border-radius: 0 6px 6px 0;
  }
  .preview-content table { border-collapse: collapse; margin: 8px 0; width: 100%; }
  .preview-content th, .preview-content td { border: 1px solid var(--border); padding: 6px 10px; font-size: 13px; }
  .preview-content th { background: #f8fafc; font-weight: 600; }
  .preview-content a { color: var(--primary); }
  .preview-content img { max-width: 100%; border-radius: 6px; }
  .preview-content hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .preview-content strong { font-weight: 700; }

  /* 题目卡片 */
  .problem-card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 20px 22px; margin: 16px 0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .problem-card h2 {
    margin-top: 0 !important; padding-bottom: 8px;
    border-bottom: 2px solid var(--primary); font-size: 1.15em;
  }
  .problem-card table {
    font-size: 13px; margin: 8px 0 12px;
  }
  .problem-card table td { padding: 4px 10px; }
  .problem-card table td:first-child { font-weight: 600; color: var(--text-secondary); width: 80px; }
  .problem-card h3 { font-size: 1em; color: var(--primary); margin: 14px 0 6px; }
  .problem-card pre { margin: 8px 0; }
  .problem-card p { margin: 4px 0; }
  .problem-card ul, .problem-card ol { margin: 4px 0; padding-left: 18px; }
  .problem-card img { max-width: 100%; }
  /* 题目描述里可能有的 HTML */
  .problem-card pre { background: #1e293b; color: #e2e8f0; padding: 12px 14px; border-radius: 8px; overflow-x: auto; font-size: 13px; white-space: pre-wrap; }
  .problem-card code { font-size: 0.88em; }
  .problem-card pre code { background: none; padding: 0; color: inherit; }
  .problem-card blockquote { border-left: 3px solid #94a3b8; padding: 2px 10px; margin: 4px 0; color: #64748b; }
  .card-del {
    position: absolute; top: 10px; right: 12px; width: 26px; height: 26px;
    border: none; border-radius: 50%; background: #fee2e2; color: #ef4444;
    cursor: pointer; font-size: 14px; line-height: 26px; text-align: center;
    z-index: 10; transition: all .15s; padding: 0;
  }
  .card-del:hover { background: #ef4444; color: #fff; }
  .fold-btn {
    font-size: 11px; padding: 1px 7px; margin-left: 8px;
    border: 1px solid #cbd5e1; border-radius: 4px;
    background: #f8fafc; color: #64748b; cursor: pointer;
    vertical-align: middle; transition: all .15s; font-weight: 400;
  }
  .fold-btn:hover { background: #e2e8f0; }
  .problem-card { position: relative; }
  .problem-card.desc-folded .desc-collapsible { display: none; }
  .problem-card.code-folded .code-collapsible { display: none; }

  /* 可编辑思路区 */
  .silu-editor {
    min-height: 60px; padding: 10px 14px; margin: 8px 0;
    border: 1px dashed #cbd5e1; border-radius: 6px;
    font-size: 14px; line-height: 1.7; outline: none;
    background: #fefce8; transition: border .2s;
  }
  .silu-editor:focus { border-color: var(--primary); border-style: solid; background: #fff; }
  .silu-editor:empty::before {
    content: attr(placeholder); color: #94a3b8;
  }

  .pane-empty {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: #c0c4cc; font-size: 14px;
  }

  /* 响应式 */
  /* 快速添加按钮 */
  .btn-toggle-editor {
    font-size: 13px; padding: 5px 8px; border: 1px solid var(--border);
    border-radius: 6px; background: #fff; cursor: pointer; transition: all .15s;
    line-height: 1;
  }
  .btn-toggle-editor:hover { background: #f1f5f9; }
  .btn-toggle-editor.hidden-editor { background: #e2e8f0; }
  .btn-add-card {
    font-size: 12px; padding: 6px 14px; border: none; border-radius: 6px;
    background: #10b981; color: #fff; cursor: pointer; font-weight: 600;
    transition: filter .15s;
  }
  .btn-add-card:hover { filter: brightness(1.15); }

  /* 编辑器隐藏状态 */
  .editor-area.editor-hidden .pane-left { display: none; }
  .editor-area.editor-hidden .resizer { display: none; }
  .editor-area.editor-hidden .pane-right { flex: 1 1 100% !important; }

  /* 弹窗遮罩 */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 9998;
    background: rgba(0,0,0,0.4); align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }

  /* 弹窗主体 */
  .modal {
    background: #fff; border-radius: 12px; width: 640px; max-width: 94vw;
    max-height: 85vh; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    display: flex; flex-direction: column;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .modal-header h3 { margin: 0; font-size: 16px; }
  .modal-close {
    width: 30px; height: 30px; border: none; border-radius: 50%;
    background: #f1f5f9; cursor: pointer; font-size: 18px; line-height: 30px;
    text-align: center; transition: all .15s; color: var(--text-secondary);
  }
  .modal-close:hover { background: #e2e8f0; color: var(--text); }
  .modal-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .modal-body label {
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
    margin-bottom: -8px;
  }
  .modal-body input, .modal-body textarea, .modal-body select {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; outline: none; font-family: inherit;
  }
  .modal-body input:focus, .modal-body textarea:focus, .modal-body select:focus {
    border-color: var(--primary);
  }
  .modal-body textarea {
    resize: vertical; min-height: 80px;
    font-family: "JetBrains Mono", "Consolas", monospace;
  }
  .modal-body textarea.desc-area {
    font-family: inherit; min-height: 100px;
  }
  .modal-row {
    display: flex; gap: 10px; align-items: center;
  }
  .modal-row > * { flex: 1; }
  .modal-row > .w-auto { flex: 0 0 auto; }
  .modal-footer {
    display: flex; gap: 8px; justify-content: flex-end;
    padding: 14px 20px; border-top: 1px solid var(--border);
  }
  .btn-cancel {
    padding: 8px 18px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; cursor: pointer; font-size: 13px; transition: all .15s;
  }
  .btn-cancel:hover { background: #f1f5f9; }

  /* 题解区块 */
  .solution-section {
    border: 1px solid #e2e8f0; border-radius: 8px;
    padding: 12px 16px; margin: 10px 0;
    background: #fafbfc; position: relative;
  }
  .solution-section h3 { font-size: 1em !important; margin: 0 0 8px 0 !important; }
  .solution-section h4 { font-size: 0.92em; color: var(--primary); margin: 8px 0 4px; }
  .solution-section pre { margin: 6px 0 !important; }
  .solution-code-wrap { position: relative; }
  .solution-code-wrap .fold-btn { position: absolute; top: 6px; right: 8px; z-index: 5; }
  .solution-code-wrap.folded pre { display: none; }
  .solution-code-wrap.folded .fold-btn { position: static; margin-bottom: 4px; }
  .solution-silu {
    min-height: 40px; padding: 8px 12px; margin: 6px 0;
    border: 1px dashed #cbd5e1; border-radius: 6px;
    font-size: 13px; line-height: 1.6; outline: none;
    background: #fefce8; transition: border .2s;
  }
  .solution-silu:focus { border-color: var(--primary); border-style: solid; background: #fff; }
  .solution-silu:empty::before { content: attr(placeholder); color: #94a3b8; }
  .solution-del {
    position: absolute; top: 8px; right: 8px; width: 22px; height: 22px;
    border: none; border-radius: 50%; background: #fee2e2; color: #ef4444;

<script>
// ============ 数据层 ============
const STORE_KEY = 'leetcode_notes_v2';

function loadAllNotes() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveAllNotes(notes) {
  localStorage.setItem(STORE_KEY, JSON.stringify(notes));
}
function getNote(dateStr) {
  const notes = loadAllNotes();
  return notes[dateStr] || '';
}
function setNote(dateStr, content) {
  const notes = loadAllNotes();
  if (content.trim()) {
    notes[dateStr] = content;
  } else {
    delete notes[dateStr];
  }
  saveAllNotes(notes);
}

// ============ 状态 ============
let currentDate = '';       // 'YYYY-MM-DD'
let currentContent = '';
let saveTimer = null;
let isDirty = false;

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function dateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function parseDate(str) { return new Date(str + 'T00:00:00'); }

function formatDateCN(str) {
  const d = parseDate(str);
  const week = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${week}`;
}

// ============ 导航 ============
function goToDate(dateStr) {
  // 保存当前内容
  if (isDirty && currentDate) {
    setNote(currentDate, currentContent);
    isDirty = false;
  }

  currentDate = dateStr;
  currentContent = getNote(dateStr);
  isDirty = false;

  document.getElementById('dateDisplay').textContent = formatDateCN(dateStr);
  updatePreview();
  updateWordCount();
  updateSaveStatus();
  renderSidebar(dateStr);
  if (typeof window.renderReviewThoughts === 'function') window.renderReviewThoughts();
  // 侧边栏自动滚动到当前日期
  requestAnimationFrame(() => {
    const active = document.querySelector('.day-row.active');
    if (active) active.scrollIntoView({ block: 'center', behavior: 'smooth' });
  });
}

function goToday() { goToDate(todayStr()); }
function goPrev() {
  const d = parseDate(currentDate); d.setDate(d.getDate() - 1);
  goToDate(dateStr(d));
}
function goNext() {
  const d = parseDate(currentDate); d.setDate(d.getDate() + 1);
  goToDate(dateStr(d));
}

// 离开页面时保存
window.addEventListener('beforeunload', () => {
  if (isDirty && currentDate) setNote(currentDate, currentContent);
});

// ============ 预览 ============
// ============ 预览 ============
function updatePreview() {
  const preview = document.getElementById('preview');
  const empty = document.getElementById('previewEmpty');
  const md = currentContent.trim();

  if (!md) {
    preview.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }

  empty.style.display = 'none';
  preview.innerHTML = marked.parse(md);

  preview.querySelectorAll('.problem-card').forEach((card, i) => {
    const h3s = card.querySelectorAll('h3');
    let descH3 = null;
    const solutionH3s = [];

    h3s.forEach(h3 => {
      const t = h3.textContent.trim();
      if (/题目内容|题目描述/.test(t)) {
        descH3 = h3;
      } else if (/^题解\s*\d+|^代码/.test(t)) {
        solutionH3s.push({ h3, name: t });
      }
    });

    // 题目描述 折叠
    if (descH3) {
      const wrap = document.createElement('div');
      wrap.className = 'desc-collapsible';
      let node = descH3.nextElementSibling;
      const stopAt = solutionH3s.length > 0 ? solutionH3s[0].h3 : null;
      while (node && node !== stopAt) {
        const next = node.nextElementSibling;
        wrap.appendChild(node);
        node = next;
      }
      card.insertBefore(wrap, stopAt || null);

      const descBtn = document.createElement('button');
      descBtn.className = 'fold-btn';
      descBtn.textContent = '收起';
      descBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        card.classList.toggle('desc-folded');
        descBtn.textContent = card.classList.contains('desc-folded') ? '展开' : '收起';
      });
      descH3.appendChild(descBtn);
    }

    // 处理每个题解
    solutionH3s.forEach((sol, solIdx) => {
      const solH3 = sol.h3;
      const nextSol = solutionH3s[solIdx + 1];
      const stopNode = nextSol ? nextSol.h3 : null;

      const section = document.createElement('div');
      section.className = 'solution-section';
      section.setAttribute('data-sol-index', solIdx);

      // 移动题解下的所有元素到 section
      const solNodes = [solH3];
      let node = solH3.nextElementSibling;
      while (node && node !== stopNode) {
        const next = node.nextElementSibling;
        solNodes.push(node);
        node = next;
      }
      solNodes.forEach(n => section.appendChild(n));
      card.insertBefore(section, stopNode || null);

      // 代码折叠
      const codeBlock = section.querySelector('pre');
      if (codeBlock) {
        const codeWrap = document.createElement('div');
        codeWrap.className = 'solution-code-wrap';
        codeBlock.parentNode.insertBefore(codeWrap, codeBlock);
        codeWrap.appendChild(codeBlock);

        const codeBtn = document.createElement('button');
        codeBtn.className = 'fold-btn';
        codeBtn.textContent = '收起';
        codeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          codeWrap.classList.toggle('folded');
          codeBtn.textContent = codeWrap.classList.contains('folded') ? '展开' : '收起';
        });
        codeWrap.appendChild(codeBtn);
      }

      // h4 思路 -> 可编辑框
      const h4s = section.querySelectorAll('h4');
      h4s.forEach(h4 => {
        if (/思路/.test(h4.textContent)) {
          let existingText = '';
          let n = h4.nextElementSibling;
          while (n) {
            existingText += (existingText ? '\n' : '') + n.innerText;
            const nn = n.nextElementSibling;
            n.remove();
            n = nn;
          }
          const editDiv = document.createElement('div');
          editDiv.className = 'solution-silu';
          editDiv.contentEditable = 'true';
          editDiv.setAttribute('data-card-index', i);
          editDiv.setAttribute('data-sol-index', solIdx);
          editDiv.innerHTML = existingText.replace(/\n/g, '<br>') || '';
          editDiv.setAttribute('placeholder', '思路...');
          editDiv.addEventListener('input', function() {
            syncSolutionSilu(i, solIdx, editDiv.innerText);
          });
          editDiv.addEventListener('blur', function() {
            syncSolutionSilu(i, solIdx, editDiv.innerText);
          });
          section.appendChild(editDiv);
        }
      });

      // 删除题解按钮（至少保留一个题解）
      if (solutionH3s.length > 1) {
        const delBtn = document.createElement('button');
        delBtn.className = 'solution-del';
        delBtn.textContent = '×';
        delBtn.title = '删除此题解';
        delBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          deleteSolution(i, solIdx);
        });
        section.appendChild(delBtn);
      }
    });

    // + 添加题解按钮
    const addBtn = document.createElement('button');
    addBtn.className = 'card-add-solution';
    addBtn.innerHTML = '+ 添加题解';
    addBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      openSolutionModal(i);
    });
    card.appendChild(addBtn);

    // 删除卡片按钮
    const delBtn = document.createElement('button');
    delBtn.className = 'card-del';
    delBtn.textContent = '×';
    delBtn.title = '删除此题';
    delBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      deleteCard(i);
    });
    card.appendChild(delBtn);
  });
}

// 同步题解级别的思路 (h4) 到 markdown 源码
function syncSolutionSilu(cardIndex, solIndex, text) {
  const re = /<div class="problem-card">[\s\S]*?<\/div>/g;
  let match;
  const blocks = [];
  while ((match = re.exec(currentContent)) !== null) {
    blocks.push({ start: match.index, end: match.index + match[0].length, text: match[0] });
  }
  if (cardIndex >= blocks.length) return;

  let block = blocks[cardIndex].text;
  // 找到第 solIndex 个 #### 思路
  const siluRe = /#### 思路\s*\n\s*([\s\S]*?)(?=\n### |\n<\/div>|$)/g;
  let solMatch, idx = 0;
  while ((solMatch = siluRe.exec(block)) !== null) {
    if (idx === solIndex) {
      const fullMatch = solMatch[0];
      const newFull = '#### 思路\n\n' + (text.trim() || '');
      const newBlock = block.substring(0, solMatch.index) + newFull + block.substring(solMatch.index + fullMatch.length);
      if (newBlock !== block) {
        const before = currentContent.substring(0, blocks[cardIndex].start);
        const after = currentContent.substring(blocks[cardIndex].end);
        currentContent = before + newBlock + after;
        isDirty = true;
        if (currentDate) { setNote(currentDate, currentContent); isDirty = false; }
        updateWordCount();
        updateSaveStatus();
        renderSidebar(currentDate);
      }
      return;
    }
    idx++;
  }
}

// 兼容旧格式
function syncSiluToSource(cardIndex, text) {
  syncSolutionSilu(cardIndex, 0, text);
}

// 打开添加题解弹窗
var pendingSolutionCardIndex = -1;
function openSolutionModal(cardIndex) {
  pendingSolutionCardIndex = cardIndex;
  document.getElementById('solMethodName').value = '';
  document.getElementById('solCode').value = '';
  document.getElementById('solSilu').value = '';
  document.getElementById('solutionModalOverlay').classList.add('show');
  document.getElementById('solMethodName').focus();
}

// 删除某个题解
function deleteSolution(cardIndex, solIndex) {
  var re = /<div class="problem-card">[\s\S]*?<\/div>/g;
  var match;
  var blocks = [];
  while ((match = re.exec(currentContent)) !== null) {
    blocks.push({ start: match.index, end: match.index + match[0].length, text: match[0] });
  }
  if (cardIndex >= blocks.length) return;

  var block = blocks[cardIndex].text;
  // 找到所有 ### 题解 N 或 ### 代码
  var solRe = /### (?:题解\s*\d+|代码).*?\n[\s\S]*?(?=\n### (?:题解\s*\d+|代码)|\n<\/div>|$)/g;
  var solBlocks = [];
  while ((match = solRe.exec(block)) !== null) {
    solBlocks.push({ start: match.index, end: match.index + match[0].length, text: match[0] });
  }
  if (solIndex < 0 || solIndex >= solBlocks.length) return;
  if (solBlocks.length <= 1) return;

  var s = solBlocks[solIndex];
  var newBlock = block.substring(0, s.start) + block.substring(s.end);
  newBlock = newBlock.replace(/\n{3,}/g, '\n\n');

  var before = currentContent.substring(0, blocks[cardIndex].start);
  var after = currentContent.substring(blocks[cardIndex].end);
  currentContent = before + newBlock + after;
  isDirty = true;
  if (currentDate) { setNote(currentDate, currentContent); isDirty = false; }
  updatePreview();
  updateWordCount();
  updateSaveStatus();
  renderSidebar(currentDate);
}

// 添加题解到卡片
function addSolutionToCard(cardIndex, methodName, code, lang, silu) {
  var re = /<div class="problem-card">[\s\S]*?<\/div>/g;
  var match;
  var blocks = [];
  while ((match = re.exec(currentContent)) !== null) {
    blocks.push({ start: match.index, end: match.index + match[0].length, text: match[0] });
  }
  if (cardIndex >= blocks.length) return;

  var block = blocks[cardIndex].text;
  // 计算现有题解数量
  var solRe = /### (?:题解\s*(\d+)|代码)/g;
  var maxN = 0;
  while ((match = solRe.exec(block)) !== null) {
    if (match[1]) maxN = Math.max(maxN, parseInt(match[1]));
    else maxN = Math.max(maxN, 1);
  }
  var newN = maxN + 1;

  var langMap = { 'C++':'cpp','Python':'python','Java':'java','Go':'go','Rust':'rust','JavaScript':'javascript','TypeScript':'typescript' };
  var langKey = langMap[lang] || 'python';

  var newSol = '\n### 题解 ' + newN + '：' + (methodName || '方法' + newN) + '\n\n';
  newSol += '```' + langKey + '\n' + (code || '') + '\n```\n\n';
  newSol += '#### 思路\n\n' + (silu || '') + '\n';

  // 插入到 </div> 之前
  var closeIdx = block.lastIndexOf('</div>');
  var newBlock = block.substring(0, closeIdx) + newSol + block.substring(closeIdx);

  var before = currentContent.substring(0, blocks[cardIndex].start);
  var after = currentContent.substring(blocks[cardIndex].end);
  currentContent = before + newBlock + after;
  isDirty = true;
  if (currentDate) { setNote(currentDate, currentContent); isDirty = false; }
  updatePreview();
  updateWordCount();
  updateSaveStatus();
  renderSidebar(currentDate);
}


function deleteCard(index) {
  var text = currentContent;
  var re = /<div class="problem-card">[\s\S]*?<\/div>/g;
  var match, newText = text;
  var blocks = [];
  while ((match = re.exec(text)) !== null) {
    blocks.push({ start: match.index, end: match.index + match[0].length });
  }
  if (index >= 0 && index < blocks.length) {
    var b = blocks[index];
    newText = text.substring(0, b.start) + text.substring(b.end);
    newText = newText.replace(/\n{3,}/g, '\n\n');
    currentContent = newText;
    isDirty = true;
    if (currentDate) { setNote(currentDate, currentContent); isDirty = false; }
    updatePreview();
    updateWordCount();
    updateSaveStatus();
    renderSidebar(currentDate);
  }
}

// ============ 字数统计 ============
function updateWordCount() {
  const len = currentContent.replace(/\s/g, '').length;
  document.getElementById('wordCount').textContent = len + ' 字';
}

// ============ 保存状态 ============
function updateSaveStatus() {
  const el = document.getElementById('saveStatus');
  el.textContent = isDirty ? '未保存...' : '已保存';
  el.style.color = isDirty ? '#f59e0b' : '#10b981';
}

// ============ 侧边栏日历 ============
function getContentSummary(md) {
  if (!md || !md.trim()) return '';

  // 提取所有题目卡片里的标题 (## xxx)
  var titles = [];
  var cardRe = /<div class="problem-card">([\s\S]*?)<\/div>/g;
  var cardMatch;
  while ((cardMatch = cardRe.exec(md)) !== null) {
    var titleMatch = cardMatch[1].match(/##\s*(.+)/);
    if (titleMatch) {
      var t = titleMatch[1].trim();
      // 去掉纯装饰前缀（如题号后的点、多余空格），保留核心标题
      t = t.replace(/^(?:P?\d+[\.\s]+)+/, '').trim();
      if (t) titles.push(t);
    }
  }

  if (titles.length > 0) {
    var summary = titles.join(' · ');
    return summary.length > 80 ? summary.slice(0, 80) + '...' : summary;
  }

  // 兜底：取第一行有意义的文字
  var text = md.replace(/```[\s\S]*?```/g, '');
  var lines = text.split('\n');
  for (var i = 0; i < lines.length; i++) {
    var cleaned = lines[i].replace(/^[#*\-+>\s\d.]+\s*/, '').trim();
    if (cleaned && cleaned.length > 1 && !/^<div|^\|/.test(cleaned)) {
      return cleaned.length > 80 ? cleaned.slice(0, 80) + '...' : cleaned;
    }
  }
  return '';
}

function renderSidebar(activeDate) {
  const container = document.getElementById('sidebarMonths');
  const allNotes = loadAllNotes();

  // 生成近6个月的日历
  const today = new Date(); today.setHours(0,0,0,0);
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
    months.push({ year: d.getFullYear(), month: d.getMonth() });
  }

  let html = '';
  months.forEach(({year, month}) => {
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    html += `<div class="month-group">`;
    html += `<div class="month-label">${year}年${month+1}月</div>`;

    // 生成该月每一天
    for (let day = 1; day <= daysInMonth; day++) {
      const d = new Date(year, month, day);
      const ds = dateStr(d);
      // 不显示未来日期
      if (ds > todayStr()) continue;

      const noteContent = allNotes[ds] || '';
      const hasNote = !!noteContent;
      const isActive = ds === activeDate;
      const weekShort = ['日','一','二','三','四','五','六'][d.getDay()];
      const summary = hasNote ? getContentSummary(noteContent) : '';

      html += `<div class="day-row${isActive ? ' active' : ''}${hasNote ? ' has-note' : ''}"
        data-date="${ds}"${summary ? ` data-summary="${summary.replace(/"/g, '&quot;')}"` : ''}>
        <span class="day-dot"></span>
        <span class="day-num">${day}</span>
        <span class="day-week">周${weekShort}</span>
      </div>`;
    }

    html += `</div>`;
  });

  container.innerHTML = html;

  // 绑定点击 + 悬浮提示事件
  const tip = document.getElementById('globalTip');
  container.querySelectorAll('.day-row').forEach(row => {
    row.addEventListener('click', () => {
      const ds = row.dataset.date;
      if (ds && ds !== currentDate) goToDate(ds);
      tip.style.display = 'none';
    });
    row.addEventListener('mouseenter', (e) => {
      const summary = row.dataset.summary;
      if (summary) {
        tip.textContent = summary;
        tip.style.display = 'block';
        positionTip(e, tip);
      }
    });
    row.addEventListener('mousemove', (e) => {
      if (tip.style.display === 'block') positionTip(e, tip);
    });
    row.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  });
}

function positionTip(e, tip) {
  const rect = tip.getBoundingClientRect();
  let x = e.clientX + 14;
  let y = e.clientY - rect.height / 2;
  // 防止超出屏幕
  if (x + rect.width > window.innerWidth - 10) x = e.clientX - rect.width - 14;
  if (y < 10) y = 10;
  if (y + rect.height > window.innerHeight - 10) y = window.innerHeight - rect.height - 10;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}

// ============ 导出 ============
document.getElementById('btnExport').addEventListener('click', () => {
  // 先保存当前
  if (isDirty && currentDate) {
    setNote(currentDate, currentContent);
    isDirty = false;
    updateSaveStatus();
  }

  const allNotes = loadAllNotes();
  const dates = Object.keys(allNotes).sort();

  if (dates.length === 0) {
    alert('还没有任何笔记');
    return;
  }

  let md = '# WangFly的刷题笔记\n\n';
  md += `> 导出时间: ${new Date().toLocaleString('zh-CN')}\n`;
  md += `> 共 ${dates.length} 天有记录\n\n---\n\n`;

  dates.forEach(ds => {
    md += `## ${formatDateCN(ds)}\n\n`;
    md += allNotes[ds].trim() + '\n\n';
    md += '---\n\n';
  });

  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `WangFly的刷题笔记_${todayStr()}.md`;
  a.click();
  URL.revokeObjectURL(url);
});

// ============ 顶部按钮 ============
document.getElementById('btnPrev').addEventListener('click', goPrev);
document.getElementById('btnNext').addEventListener('click', goNext);
document.getElementById('btnToday').addEventListener('click', goToday);

// 编辑器显隐切换（默认隐藏）
var editorVisible = false;
(function() {
  document.getElementById('editorArea').classList.add('editor-hidden');
  document.getElementById('btnToggleEditor').classList.add('hidden-editor');
  document.getElementById('btnToggleEditor').title = '显示编辑器';
})();
document.getElementById('btnToggleEditor').addEventListener('click', function() {
  editorVisible = !editorVisible;
  var area = document.getElementById('editorArea');

// ============ 题目导入 ============
function parseUrl(url) {
  url = url.trim();
  let m;
  m = url.match(/leetcode\.(?:com|cn)\/problems\/([^\/?#]+)/i);
  if (m) return { platform: 'LeetCode', id: m[1] };
  m = url.match(/luogu\.com\.cn\/problem\/([^\/?#]+)/i);
  if (m) return { platform: '洛谷', id: m[1] };
  m = url.match(/codeforces\.com\/problemset\/problem\/(\d+)\/([A-Z]\d*)/i);
  if (m) return { platform: 'Codeforces', id: m[1] + m[2] };
  m = url.match(/codeforces\.com\/contest\/(\d+)\/problem\/([A-Z]\d*)/i);
  if (m) return { platform: 'Codeforces', id: m[1] + m[2] };
  m = url.match(/atcoder\.jp\/contests\/([^\/]+)\/tasks\/([^\/?#]+)/i);
  if (m) return { platform: 'AtCoder', id: m[2] };
  m = url.match(/nowcoder\.com\//i);
  if (m) return { platform: '牛客', id: '' };
  return null;
}

// 自动解析粘贴的题目原文
function parseProblemContent(raw, platform) {
  const text = raw.trim();
  if (!text) return {};
  const lines = text.split('\n');

  // 1. 提取标题（第一行非空且不是明显标签的行）
  let title = '';
  for (let i = 0; i < Math.min(lines.length, 5); i++) {
    const line = lines[i].trim();
    // 跳过 "题目描述" "难度" 等标签行
    if (/^(题目描述|问题描述|题目背景|题目|难度|标签|时间限制|内存限制|输入格式|输出格式|示例|样例|提示|说明|注意|来源)/.test(line)) continue;
    if (/^\d+[\.\s、]/.test(line)) { title = line; break; }
    if (line.length >= 2 && line.length < 120 && !/^[A-Z][a-z]+:/.test(line)) { title = line; break; }
  }
  if (!title && lines[0]) title = lines[0].trim().slice(0, 80);

  // 2. 提取题号
  let number = '';
  const numMatch = title.match(/^(\d+)[\.\s、]/);
  if (numMatch) { number = numMatch[1]; }
  if (!number && platform === '洛谷') {
    const pm = text.match(/P(\d+)/);
    if (pm) number = 'P' + pm[1];
  }

  // 3. 检测难度
  let difficulty = '';
  const diffPatterns = [/简单/, /容易/, /Easy/i, /入门/, /普及[-\/]?/, /提高[+\/]?/, /省选/, /NOI/i, /中等/, /Medium/i, /困难/, /Hard/i, /CF\s*\d+/i];
  for (const p of diffPatterns) {
    const m = text.match(p);
    if (m) { difficulty = m[0]; break; }
  }

  // 4. 按章节拆分
  const sections = [];
  const sectionKeys = [
    { re: /^(题目描述|问题描述|题目内容|Descriptio)/i, key: '题目描述' },
    { re: /^(题目背景)/i, key: '题目背景' },
    { re: /^(输入格式|输入描述|Input)/i, key: '输入格式' },
    { re: /^(输出格式|输出描述|Output)/i, key: '输出格式' },
    { re: /^(示例|样例|Examples?)[\s\d]*/i, key: '示例' },
    { re: /^(提示|说明|注意|Note|Constraints?|数据范围|限制)/i, key: '数据范围' },
    { re: /^(标签|Tags?|分类)/i, key: '标签' },
    { re: /^(来源|出处)/i, key: '来源' },
  ];

  let currentSection = { key: '题目描述', lines: [] };
  let preSectionLines = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    // 跳过已经是标题的行
    if (line === title) continue;

    let matched = false;
    for (const sk of sectionKeys) {
      if (sk.re.test(line)) {
        if (currentSection.lines.length > 0) sections.push({ ...currentSection });
        currentSection = { key: sk.key, lines: [] };
        // 如果同一行后面还有内容
        const rest = line.replace(sk.re, '').trim();
        if (rest) currentSection.lines.push(rest);
        matched = true;
        break;
      }
    }
    if (!matched) currentSection.lines.push(line);
  }
  if (currentSection.lines.length > 0) sections.push({ ...currentSection });

  // 合并内容
  const contentMap = {};
  sections.forEach(sec => {
    const text = sec.lines.join('\n').trim();
    if (text) {
      if (contentMap[sec.key]) contentMap[sec.key] += '\n\n' + text;
      else contentMap[sec.key] = text;
    }
  });

  // 提取数据范围（时间/内存）
  let limits = '';
  const timeMatch = text.match(/(?:时间限制|Time Limit)[：:\s]*([\d.]+)\s*(?:s|秒|ms|毫秒)?/i);
  const memMatch = text.match(/(?:内存限制|Memory Limit)[：:\s]*([\d.]+)\s*(?:MB|GB|KB|M|G|兆)?/i);
  if (timeMatch || memMatch) {
    limits = (timeMatch ? '时间 ' + timeMatch[1] + (timeMatch[0].includes('ms') ? 'ms' : 's') : '') +
             (timeMatch && memMatch ? ' | ' : '') +
             (memMatch ? '内存 ' + memMatch[1] + 'MB' : '');
  }

  // 检测标签
  const tagKeywords = ['数组','字符串','链表','栈','队列','堆','哈希','树','图','双指针','滑动窗口','二分','排序','搜索','动态规划','DP','贪心','回溯','分治','位运算','数学','递归','DFS','BFS'];
  const foundTags = [];
  const lowerText = text.toLowerCase();
  tagKeywords.forEach(t => { if (lowerText.includes(t.toLowerCase())) foundTags.push(t); });

  // 拼内容
  let content = '';
  const order = ['题目背景','题目描述','输入格式','输出格式','示例','数据范围','提示','来源'];
  order.forEach(key => {
    if (contentMap[key]) {
      // 对于非描述性的 key，加粗显示
      if (key !== '题目描述' && key !== '题目背景') {
        content += `**${key}**：${contentMap[key]}\n\n`;
      } else {
        content += contentMap[key] + '\n\n';
      }
    }
  });
  // 处理没匹配到的
  Object.keys(contentMap).forEach(key => {
    if (!order.includes(key) && contentMap[key]) {
      content += `**${key}**：${contentMap[key]}\n\n`;
    }
  });

  return { title, number, difficulty, content: content.trim(), limits, tags: foundTags };
}

function buildMarkdown(info, url, code, lang) {
  let md = `\n\n<div class="problem-card">\n\n## ${info.number ? info.number + '. ' : ''}${info.title || '未命名题目'}\n\n`;
  md += `| 属性 | 值 |\n|------|----|\n`;
  if (url) md += `| **链接** | [${info.platform || '题目链接'}](${url}) |\n`;
  md += `| **难度** | ${info.difficulty || '中等'} |\n`;
  if (info.limits) md += `| **数据范围** | ${info.limits} |\n`;
  if (info.tags && info.tags.length) md += `| **标签** | ${info.tags.join(', ')} |\n`;
  md += `\n`;

  if (info.content) md += `### 题目内容\n\n${info.content}\n\n`;

  if (code && code.trim()) {
    const langMap = { 'cpp':'cpp','python':'python','java':'java','go':'go','rust':'rust','javascript':'javascript','typescript':'typescript' };
    md += `### 题解 1\n\n\`\`\`${langMap[lang] || lang}\n${code.trim()}\n\`\`\`\n\n`;
  }

  md += `#### 思路\n\n\n`;
  md += `</div>\n`;
  return md;
}

(function() {
  const editorArea = document.getElementById('editorArea');
  const paneLeft = document.getElementById('paneLeft');
  const paneRight = document.getElementById('paneRight');
  const resizer = document.getElementById('resizer');
  let isDragging = false;

  // 初始化：各占50%
  paneLeft.style.flex = '1 1 0%';
  paneRight.style.flex = '1 1 0%';

  resizer.addEventListener('mousedown', (e) => {
    e.preventDefault();
    isDragging = true;
    resizer.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const rect = editorArea.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const totalWidth = rect.width;
    const resizerWidth = resizer.offsetWidth;

    // 限制左右最小宽度各 260px
    const minPane = 260;
    let leftRatio = x / totalWidth;
    let rightRatio = 1 - leftRatio;

    if (x < minPane) {
      leftRatio = minPane / totalWidth;
      rightRatio = 1 - leftRatio;
    } else if (x > totalWidth - minPane) {
      rightRatio = minPane / totalWidth;
      leftRatio = 1 - rightRatio;
    }

    paneLeft.style.flex = `${leftRatio} 1 0%`;
    paneRight.style.flex = `${rightRatio} 1 0%`;
  });

  document.addEventListener('mouseup', () => {
    if (!isDragging) return;
    isDragging = false;
    resizer.classList.remove('active');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

// ============ SRS 遗忘曲线回溯系统 ============
(function() {
  var BANK_KEY = 'srs_problem_bank';
  var REVIEW_KEY = 'srs_daily_review';
  var CHECKIN_KEY = 'srs_checkin';

  var INTERVALS = [1, 2, 4, 7, 15, 30];  // 艾宾浩斯间隔（天）

  var checkins = {};      // { "YYYY-MM-DD": true }

  function today() { return todayStr(); }

  function addDays(dateStr, n) {
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // ===== 持久化 =====
  function loadBank() {
    try { problemBank = JSON.parse(localStorage.getItem(BANK_KEY)) || []; }
    catch(e) { problemBank = []; }
  }
  function saveBank() { localStorage.setItem(BANK_KEY, JSON.stringify(problemBank)); }

  function loadReview() {
    try { dailyReview = JSON.parse(localStorage.getItem(REVIEW_KEY)) || {}; }
    catch(e) { dailyReview = {}; }
  }
  function saveReview() { localStorage.setItem(REVIEW_KEY, JSON.stringify(dailyReview)); }

  function loadCheckins() {
    try { checkins = JSON.parse(localStorage.getItem(CHECKIN_KEY)) || {}; }
    catch(e) { checkins = {}; }
  }
  function saveCheckins() { localStorage.setItem(CHECKIN_KEY, JSON.stringify(checkins)); }

  // ===== 题目提取（从笔记中扫描 problem-card） =====
  function extractProblemsFromNotes() {
    var allNotes = loadAllNotes();
    var dates = Object.keys(allNotes);
    var extracted = [];

    dates.forEach(function(ds) {
      var md = allNotes[ds];
      var re = /<div class="problem-card">([\s\S]*?)<\/div>/g;
      var match;
      while ((match = re.exec(md)) !== null) {
        var block = match[1];

        // 提取标题（去掉题号前缀如 "P9425. "）
        var titleMatch = block.match(/##\s*(.+)/);
        var title = titleMatch ? titleMatch[1].trim() : '未命名题目';

        // 提取链接：优先匹配 | **链接** | [xxx](url) | 格式
        // 用贪婪 .* 匹配链接文本（文本中可能含嵌套方括号如 [蓝桥杯 2023]）
        var url = '';
        var urlRowMatch = block.match(/\*\*链接\*\*\s*\|\s*\[.*\]\((https?:\/\/[^)]+)\)/);
        if (urlRowMatch) {
          url = urlRowMatch[1];
        } else {
          // 备选：匹配任意 [xxx](url) 格式
          var anyUrl = block.match(/\[.*\]\((https?:\/\/[^)]+)\)/);
          url = anyUrl ? anyUrl[1] : '';
        }

        // 提取平台：优先从表格获取，其次从 URL 推断
        var platform = '未知';
        var platMatch = block.match(/\*\*平台\*\*\s*\|\s*(.+)/);
        if (platMatch) {
          platform = platMatch[1].trim();
        }
        if (platform === '未知' && url) {
          var parsed = parseUrl(url);
          if (parsed) platform = parsed.platform;
        }

        // 提取难度
        var diffMatch = block.match(/\*\*难度\*\*\s*\|\s*(.+)/);
        var difficulty = diffMatch ? diffMatch[1].trim() : '中等';

        // 提取标签
        var tagsMatch = block.match(/\*\*标签\*\*\s*\|\s*(.+)/);
        var tags = tagsMatch ? tagsMatch[1].split(/[,，]/).map(function(t) { return t.trim(); }).filter(Boolean) : [];

        extracted.push({
          id: '',
          title: title,
          url: url,
          platform: platform,
          difficulty: difficulty,
          tags: tags,
          sourceDate: ds
        });
      }
    });

    return extracted;
  }

  // UUID
  function uuid() {
    return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  }

  // URL 归一化：去尾部 description/、去 fragment #xxx、去尾部斜杠
  function normalizeUrl(url) {
    if (!url) return '';
    var u = url.replace(/#.*$/, '');              // 去 fragment
    u = u.replace(/\/description\/?$/, '');       // LeetCode /description/
    u = u.replace(/\/$/, '');                     // 去尾部斜杠
    return u;
  }

  // ===== 同步题库（增量合并，已有题目不丢失复习进度） =====
  function syncBank() {
    var extracted = extractProblemsFromNotes();

    extracted.forEach(function(ep) {
      var existing = null;
      var normUrl = normalizeUrl(ep.url);

      if (normUrl) {
        // 1) 按归一化 URL 找
        existing = problemBank.find(function(p) { return normalizeUrl(p.url) === normUrl; });
        // 2) URL 没找到，尝试按标题匹配（之前可能无链接加入的）
        if (!existing) {
          existing = problemBank.find(function(p) { return p.title === ep.title && !p.url; });
          if (existing) {
            existing.url = ep.url;
            existing.platform = ep.platform;
          }
        }
        // 3) 如果原来 URL 不够规范，更新
        if (existing && normalizeUrl(existing.url) !== normUrl) {
          existing.url = ep.url;
        }
      } else {
        // 无链接的按标题去重
        existing = problemBank.find(function(p) { return p.title === ep.title && !p.url; });
      }

      if (!existing) {
        ep.id = uuid();
        ep.dateAdded = ep.sourceDate;
        ep.reviewStage = 0;
        ep.nextReviewDate = addDays(ep.sourceDate, 1);
        ep.reviewHistory = [];
        problemBank.push(ep);
      } else {
        if (!existing.difficulty || existing.difficulty === '中等') existing.difficulty = ep.difficulty;
        if (!existing.tags || existing.tags.length === 0) existing.tags = ep.tags;
        if (existing.platform === '未知' && ep.platform !== '未知') existing.platform = ep.platform;
      }
    });

    saveBank();
  }

  // ===== 重建题库（清空后重新扫描） =====
  function rebuildBank() {
    problemBank = [];
    saveBank();
    // 清空今日回溯任务，让 getTodayReview 重新生成
    var td = today();
    delete dailyReview[td];
    saveReview();
    syncBank();
    getTodayReview();
    renderReviewPanel();
  }

  // ===== 今日回溯题目选取 =====
  function getTodayReview() {
    var td = today();

    // 如果今天已经生成过，直接返回
    if (dailyReview[td] && dailyReview[td].assigned.length > 0) {
      return dailyReview[td];
    }

    // 选取应复习的题目
    var candidates = problemBank.filter(function(p) {
      return p.reviewStage < INTERVALS.length && p.nextReviewDate <= td;
    });

    // 排序：优先 overdue（最久远的排前面），其次今日到期
    candidates.sort(function(a, b) {
      if (a.nextReviewDate < b.nextReviewDate) return -1;
      if (a.nextReviewDate > b.nextReviewDate) return 1;
      return a.reviewStage - b.reviewStage;
    });

    var selected = candidates.slice(0, MAX_DAILY);

    dailyReview[td] = {
      assigned: selected.map(function(p) { return p.id; }),
      completed: [],
      allDone: false
    };
    saveReview();

    return dailyReview[td];
  }

  // ===== 完成单个题目 =====
  function completeProblem(problemId) {
    var td = today();
    var review = dailyReview[td];
    if (!review) return;

    // 标记已完成
    if (review.completed.indexOf(problemId) < 0) {
      review.completed.push(problemId);
    }

    // 更新题库中的题目状态
    var problem = problemBank.find(function(p) { return p.id === problemId; });
    if (problem) {
      problem.reviewHistory.push(td);
      problem.reviewStage = Math.min(problem.reviewStage + 1, INTERVALS.length);
      if (problem.reviewStage < INTERVALS.length) {
        problem.nextReviewDate = addDays(td, INTERVALS[problem.reviewStage]);
      } else {
        problem.nextReviewDate = 'mastered';
      }
      saveBank();
    }

    // 检查是否全部完成
    review.allDone = review.assigned.every(function(id) {
      return review.completed.indexOf(id) >= 0;
    });
    saveReview();

    // 全部完成 → 自动签到
    if (review.allDone && !checkins[td]) {
      doCheckin();
    }
  }

  // 取消完成（撤销）
  function uncompleteProblem(problemId) {
    var td = today();
    var review = dailyReview[td];
    if (!review) return;

    var idx = review.completed.indexOf(problemId);
    if (idx >= 0) review.completed.splice(idx, 1);
    review.allDone = false;

    // 回退题目状态
    var problem = problemBank.find(function(p) { return p.id === problemId; });
    if (problem) {
      var hIdx = problem.reviewHistory.lastIndexOf(td);
      if (hIdx >= 0) problem.reviewHistory.splice(hIdx, 1);
      problem.reviewStage = Math.max(0, problem.reviewStage - 1);
      if (problem.reviewStage < INTERVALS.length) {
        problem.nextReviewDate = addDays(td, INTERVALS[problem.reviewStage]);
      } else {
        problem.nextReviewDate = addDays(td, INTERVALS[INTERVALS.length - 1]);
      }
      saveBank();
    }

    saveReview();
  }

  // ===== 签到系统 =====
  function doCheckin() {

    if (checkins[td]) return;
    checkins[td] = true;

  function getStreak() {
    var td = today();
    var d = new Date(td + 'T00:00:00');
    var streak = 0;
    while (true) {
      var ds = dateStr(d);
      if (checkins[ds]) {
        streak++;
        d.setDate(d.getDate() - 1);
      } else if (ds === today()) {
        // 今天还没签，继续往前看
        d.setDate(d.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  function getMaxStreak() {
    var dates = Object.keys(checkins).sort();
    if (dates.length === 0) return 0;
    var max = 1, cur = 1;
    for (var i = 1; i < dates.length; i++) {
      var prev = new Date(dates[i-1] + 'T00:00:00');
      var curr = new Date(dates[i] + 'T00:00:00');
      if ((curr - prev) / 86400000 === 1) {
        cur++;
        max = Math.max(max, cur);
      } else {
        cur = 1;
      }
    }
    return max;
  }

          submitBtn.disabled = true;
          submitBtn.textContent = '✓ 今日回溯已完成';
        } else {
          submitBtn.disabled = false;
          submitBtn.textContent = '✓ 提交今日回溯';

      } else {
        submitWrap.style.display = 'none';

    // 签到日历
    renderCheckinCalendar();

    renderBadges();

    // 签到统计（侧边栏）
    var sfStreak = document.getElementById('sfStreak');
    if (sfStreak) sfStreak.textContent = '连续 ' + getStreak() + ' 天';

    // 刷新思路区（若已提交过回溯则显示已完成的题目）
    renderReviewThoughts();
  }

  // ===== 渲染签到日历（侧边栏·当月·周网格） =====
  function renderCheckinCalendar() {
    var td = today();
    var baseDate = new Date(td + 'T00:00:00');
    baseDate.setMonth(baseDate.getMonth() + checkinMonthOffset);
    var year = baseDate.getFullYear();
    var month = baseDate.getMonth();
    var d = new Date(td + 'T00:00:00');
    var todayDay = (checkinMonthOffset === 0) ? d.getDate() : 0;
    var daysInMonth = new Date(year, month + 1, 0).getDate();

    // 当月1号周几 (0=周日, 转为周一=0)
    var firstDay = new Date(year, month, 1).getDay();
    var startOffset = firstDay === 0 ? 6 : firstDay - 1;

    var container = document.getElementById('sfHeatmap');
    if (!container) return;

    // 月份标题
    var monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    var titleEl = document.querySelector('.sf-checkin-title');
    if (titleEl) {
      titleEl.innerHTML = '<span class="sf-month-arrow" data-dir="-1" title="上月">◀</span> ' +
        year + '年' + monthNames[month] +
        ' <span class="sf-month-arrow" data-dir="1" title="下月">▶</span>';
    }

    function streakAt(ds) {
      if (!checkins[ds]) return 0;
      var s = 1, cd = new Date(ds + 'T00:00:00');
      for (var i = 1; i < 365; i++) {
        cd.setDate(cd.getDate() - 1);
        var p = cd.getFullYear() + '-' + String(cd.getMonth()+1).padStart(2,'0') + '-' + String(cd.getDate()).padStart(2,'0');
        if (checkins[p]) s++; else break;
      }
      return s;
    }

    // 构建网格行（每行7天）
    var days = [];
    for (var i = 0; i < startOffset; i++) { days.push({ placeholder: true }); }
    for (var day = 1; day <= daysInMonth; day++) {
      var ds = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      var item = { day: day, ds: ds };
      if (checkins[ds]) {
        item.checked = true;
        item.lvl = Math.min(streakAt(ds) >= 30 ? 5 : streakAt(ds) >= 14 ? 4 : streakAt(ds) >= 7 ? 3 : streakAt(ds) >= 3 ? 2 : 1, 5);
        item.tip = (month+1) + '月' + day + '日 · 已签到';
      } else if (day === todayDay && checkinMonthOffset === 0) {
        item.today = true;
        item.tip = (month+1) + '月' + day + '日 · 今天';
      } else {
        item.tip = (month+1) + '月' + day + '日 · 未签到';
      }
      days.push(item);
    }

    var html = '';
    for (var r = 0; r < days.length; r += 7) {
      html += '<div class="sf-heatmap-row">';
      for (var c = 0; c < 7 && r + c < days.length; c++) {
        var it = days[r + c];
        if (it.placeholder) {
          html += '<div class="sf-heatmap-day placeholder"></div>';
        } else {
          var cls = 'sf-heatmap-day';
          if (it.checked) cls += ' checked l' + it.lvl;
          if (it.today) cls += ' today';
          html += '<div class="' + cls + '" data-tip="' + it.tip + '"></div>';
        }
      }
      html += '</div>';
    }
    container.innerHTML = html;

    // 月份箭头点击
    container.querySelectorAll('.sf-month-arrow').forEach(function(arr) {
      arr.addEventListener('click', function(e) {
        e.stopPropagation();
        navigateMonth(parseInt(this.getAttribute('data-dir')));
      });
    });
    // 绑定标题里的箭头
    if (titleEl) {
      titleEl.querySelectorAll('.sf-month-arrow').forEach(function(arr) {
        arr.addEventListener('click', function(e) {
          e.stopPropagation();
          navigateMonth(parseInt(this.getAttribute('data-dir')));
        });
      });
    }
  }

  // 月份导航
  // 月份导航（存储偏移量）
  var checkinMonthOffset = 0;
  function navigateMonth(delta) {
    checkinMonthOffset += delta;
    // 不允许导航到未来月份
    var td = today();
    var d = new Date(td + 'T00:00:00');
    d.setMonth(d.getMonth() + checkinMonthOffset);
    var now = new Date(td + 'T00:00:00');
    if (d > new Date(now.getFullYear(), now.getMonth() + 1, 0)) {
      checkinMonthOffset -= delta;
      return;
    }
    renderCheckinCalendar();
  }

  // ===== 事件绑定 =====
  // 回溯面板折叠（只折叠 body，头部按钮始终可见）
  var reviewBody = document.getElementById('reviewBody');
  var reviewExpanded = true;

  document.getElementById('btnReviewToggle').addEventListener('click', function() {
    reviewExpanded = !reviewExpanded;
    if (reviewExpanded) {
      reviewBody.classList.remove('collapsed');
      document.getElementById('btnReviewToggle').textContent = '−';
    } else {
      reviewBody.classList.add('collapsed');
      document.getElementById('btnReviewToggle').textContent = '+';
    }
  });

  // 题目 checkbox 变化 → 更新提交按钮状态
  document.getElementById('reviewProblems').addEventListener('change', function(e) {
    if (!e.target.classList.contains('review-checkbox')) return;
    var card = e.target.closest('.review-card');
    if (!card) return;
    if (e.target.checked) {
      card.classList.add('checked');
    } else {
      card.classList.remove('checked');
    }
    updateSubmitButton();
  });

  function updateSubmitButton() {
    var checkedCount = document.querySelectorAll('#reviewProblems .review-checkbox:checked:not(:disabled)').length;
    var submitBtn = document.getElementById('btnReviewSubmit');
    submitBtn.disabled = checkedCount === 0;
    if (checkedCount > 0) {
      submitBtn.textContent = '✓ 提交今日回溯（' + checkedCount + ' 题）';
    } else {
      submitBtn.textContent = '✓ 提交今日回溯';
    }
  }

  // 提交按钮 → 批量记录完成
  document.getElementById('btnReviewSubmit').addEventListener('click', function() {
    var checkboxes = document.querySelectorAll('#reviewProblems .review-checkbox:checked:not(:disabled)');
    if (checkboxes.length === 0) return;

    var td = today();
    checkboxes.forEach(function(cb) {
      var card = cb.closest('.review-card');
      var pid = card.dataset.pid;
      if (pid) completeProblem(pid);
    });

    // 全部完成 → 自动签到
    var review = dailyReview[td];
    if (review && review.allDone && !checkins[td]) {
      doCheckin();
    }

    renderReviewPanel();
    updatePreview();
  });

  // 签到按钮

  // 重建题库按钮
  document.getElementById('btnRebuildBank').addEventListener('click', function() {
    if (confirm('确定要清空题库并重新从所有笔记中提取题目吗？\n\n已有复习进度会丢失。')) {
      rebuildBank();
    }
  });

  // 题库同步策略：每次 renderReviewPanel 时自动 syncBank

  // ===== 初始化 =====
  // ===== 回顾思路系统 =====
  var THOUGHTS_KEY = 'srs_review_thoughts';

  function loadReviewThoughts() {
    try { return JSON.parse(localStorage.getItem(THOUGHTS_KEY)) || {}; }
    catch(e) { return {}; }
  }
  function saveReviewThoughtsData(data) {
    localStorage.setItem(THOUGHTS_KEY, JSON.stringify(data));
  }
  function getThought(dateStr, problemId) {
    var all = loadReviewThoughts();
    return (all[dateStr] && all[dateStr][problemId]) ? all[dateStr][problemId] : '';
  }
  function setThought(dateStr, problemId, text) {
    var all = loadReviewThoughts();
    if (!all[dateStr]) all[dateStr] = {};
    if (text.trim()) {
      all[dateStr][problemId] = text;
    } else {
      delete all[dateStr][problemId];
      if (Object.keys(all[dateStr]).length === 0) delete all[dateStr];
    }
    saveReviewThoughtsData(all);
  }

  function renderReviewThoughts() {
    var td = today();
    var review = dailyReview[td] || { assigned: [], completed: [], allDone: false };
    var container = document.getElementById('reviewThoughts');
    var placeholder = document.getElementById('thoughtPlaceholder');

    var completedIds = review.completed || [];

    var reviewedProblems = completedIds.map(function(id) {
      return problemBank.find(function(p) { return p.id === id; });
    }).filter(Boolean);

    if (reviewedProblems.length === 0) {
      container.innerHTML = '';
      container.appendChild(placeholder);
      placeholder.style.display = '';
      return;
    }

    placeholder.style.display = 'none';

    var html = reviewedProblems.map(function(p) {
      var platformClass = { 'LeetCode':'leet', '洛谷':'luogu', 'Codeforces':'cf', 'AtCoder':'atc', '牛客':'nc' }[p.platform] || 'unknown';
      var diffClass = '';
      if (/简单|容易|Easy/i.test(p.difficulty)) diffClass = 'easy';
      else if (/中等|Medium/i.test(p.difficulty)) diffClass = 'medium';
      else if (/困难|Hard/i.test(p.difficulty)) diffClass = 'hard';

      var stageText = p.reviewStage < INTERVALS.length
        ? '第' + (p.reviewStage + 1) + '轮'
        : '已掌握';

      var existingThought = getThought(td, p.id);

      return '<div class="thought-card" data-pid="' + p.id + '">' +
        '<div class="thought-card-header">' +
          '<span class="tp-platform ' + platformClass + '">' + p.platform + '</span>' +
          (p.url
            ? '<a class="tp-title" href="' + p.url + '" target="_blank">' + p.title + '</a>'
            : '<span class="tp-title">' + p.title + '</span>') +
          '<span class="tp-diff ' + diffClass + '">' + p.difficulty + '</span>' +
          '<span style="font-size:10px;color:#94a3b8;white-space:nowrap">' + stageText + '</span>' +
        '</div>' +
        '<textarea class="thought-textarea" data-pid="' + p.id + '" placeholder="这道题复习后有什么新想法？写下来...">' +
          (existingThought || '') +
        '</textarea>' +
      '</div>';
    }).join('');

    container.innerHTML = html;

    // 绑定 textarea 自动保存 + 同步到预览
    container.querySelectorAll('.thought-textarea').forEach(function(ta) {
      ta.addEventListener('input', function() {
        var pid = this.dataset.pid;
        setThought(td, pid, this.value);
        syncThoughtsToNotes();  // 自动同步到预览顶部
      });
    });
  }

  // 自动同步思路到笔记（实时替换，防止重复）
  var _syncThoughtsTimer = null;
  function syncThoughtsToNotes() {
    clearTimeout(_syncThoughtsTimer);
    _syncThoughtsTimer = setTimeout(_doSyncThoughts, 500);
  }

  function _doSyncThoughts() {
    var td = today();
    var allThoughts = loadReviewThoughts();
    var dayThoughts = allThoughts[td] || {};

    var reviewedProblems = (dailyReview[td] && dailyReview[td].completed || []).map(function(id) {
      return problemBank.find(function(p) { return p.id === id; });
    }).filter(Boolean);

    var blocks = [];
    reviewedProblems.forEach(function(p) {
      var text = dayThoughts[p.id];
      if (!text || !text.trim()) return;
      var platformLabel = p.platform || '';
      blocks.push('### 🔄 回顾思路: [' + p.title + '](' + (p.url || '#') + ') ' + platformLabel);
      blocks.push('');
      blocks.push(text);
      blocks.push('');
    });

    var notes = loadAllNotes();
    var existing = notes[td] || '';

    // 移除已有的回顾思路块（防重复）
    existing = existing.replace(/(?:### 🔄 回顾思路:[\s\S]*?)(?=\n(?:##|### (?!🔄))|$)/g, '');
    existing = existing.trim();

    // 将新的思路块放在内容顶部
    if (blocks.length > 0) {
      notes[td] = blocks.join('\n') + '\n\n' + existing;
    } else {
      notes[td] = existing;
    }

    saveAllNotes(notes);

    if (currentDate === td) {
      currentContent = notes[td];
    }
    // 保留预览滚动位置
    var preview = document.getElementById('preview');
    var scrollTop = preview.scrollTop;
    updatePreview();
    preview.scrollTop = scrollTop;
    updateWordCount();
    renderSidebar(td);
  }

  function initSRS() {
    loadBank();
    loadReview();
    loadCheckins();
    loadBadges();
    loadWornBadge();

    // 同步题库（从笔记中提取新题目）
    syncBank();

    // 生成今日回溯
    getTodayReview();

        // 检测已有签到天数，补发应得的勋章（首次使用勋章系统时）
    checkAndAwardBadges();

    // 如果今天已完成全部回溯，但还没签到，自动补签
    var td = today();
    var review = dailyReview[td];
    if (review && review.allDone && !checkins[td]) {
      doCheckin();
    }

    // 渲染
    renderReviewPanel();
  }

  // 暴露到全局
  window.initSRS = initSRS;
  window.renderReviewPanel = renderReviewPanel;
  window.renderReviewThoughts = renderReviewThoughts;
  window.syncThoughtsToNotes = syncThoughtsToNotes;
  window.syncSRSBank = syncBank;
  window.rebuildSRSBank = rebuildBank;

  // ===== 勋章墙弹窗事件 =====
  function openBadgeWall() {
    renderBadges();
    document.getElementById('badgeWallOverlay').classList.add('show');
  }
  function closeBadgeWall() {
    document.getElementById('badgeWallOverlay').classList.remove('show');
  }
  document.getElementById('topbarBadge').addEventListener('click', openBadgeWall);
  document.getElementById('sfBadge').addEventListener('click', openBadgeWall);
  document.getElementById('badgeWallClose').addEventListener('click', closeBadgeWall);
  document.getElementById('badgeWallOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeBadgeWall();
  });
})();
