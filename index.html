    {id:'y25J',title:'涂格子',year:'2025 第16届',diff:'困难',tags:['DP','组合数学'],url:''}
  ];

  var problemBank = [];
  var dailyPractice = {}; // { "YYYY-MM-DD": { assigned: [...ids], completed: [...ids], allDone: false } }

  // ===== 持久化 =====
  function loadBank() {
    try {
      var saved = JSON.parse(localStorage.getItem(DP_BANK_KEY));
      problemBank = saved || [];
    } catch(e) { problemBank = []; }
  }
  function saveBank() { localStorage.setItem(DP_BANK_KEY, JSON.stringify(problemBank)); }

  function loadDaily() {
    try { dailyPractice = JSON.parse(localStorage.getItem(DP_DAILY_KEY)) || {}; }
    catch(e) { dailyPractice = {}; }
  }
  function saveDaily() { localStorage.setItem(DP_DAILY_KEY, JSON.stringify(dailyPractice)); }

  function today() { return todayStr(); }

  // ===== 初始化题库 =====
  function initBank() {
    loadBank();
    if (problemBank.length === 0) {
      // 首次使用，写入60道种子题
      SEED_PROBLEMS.forEach(function(p) {
        problemBank.push({
          id: p.id,
          title: p.title,
          year: p.year,
          difficulty: p.diff,
          tags: p.tags,
          url: p.url,
          assigned: false,
          assignedDate: ''
        });
      });
      saveBank();
    }
  }

  // ===== 按日期确定性洗牌（保证同一天多次刷新生成的题目一致） =====
  function seededShuffle(arr, seed) {
    var a = arr.slice();
    var hash = 0;
    for (var i = 0; i < seed.length; i++) {
      hash = ((hash << 5) - hash) + seed.charCodeAt(i);
      hash |= 0;
    }
    function rand() {
      hash = (hash * 1103515245 + 12345) | 0;
      return (hash >>> 0) / 4294967296;
    }
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rand() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // ===== 生成今日刷题任务 =====
  function generateToday() {
    var td = today();
    if (td < DP_START_DATE) return null;

    // 如果今天已生成过，直接返回
    if (dailyPractice[td] && dailyPractice[td].assigned.length > 0) {
      return dailyPractice[td];
    }

    // 收集已分配过的题目ID
    var usedIds = {};
    Object.keys(dailyPractice).forEach(function(ds) {
      var rec = dailyPractice[ds];
      if (rec && rec.assigned) {
        rec.assigned.forEach(function(id) { usedIds[id] = true; });
      }
    });
    // 也要从bank中标记已分配
    problemBank.forEach(function(p) {
      if (p.assigned) usedIds[p.id] = true;
    });

    // 未使用的题目按难度分组
    var easy = [], medium = [], hard = [];
    problemBank.forEach(function(p) {
      if (usedIds[p.id]) return;
      if (p.difficulty === '简单' || p.difficulty === 'easy') easy.push(p);
      else if (p.difficulty === '中等' || p.difficulty === 'medium') medium.push(p);
      else hard.push(p);
    });

    if (easy.length + medium.length + hard.length === 0) return null;

    // 用日期做种子洗牌
    easy = seededShuffle(easy, td + '_easy');
    medium = seededShuffle(medium, td + '_med');
    hard = seededShuffle(hard, td + '_hard');

    // 分配：1简单 + 2中等 + 1困难
    var selected = [];
    if (easy.length > 0) selected.push(easy[0]);
    if (medium.length > 0) { selected.push(medium[0]); if (medium.length > 1) selected.push(medium[1]); }
    else if (easy.length > 1) selected.push(easy[1]); // 用简单补
    if (hard.length > 0) selected.push(hard[0]);
    else if (medium.length > 2) selected.push(medium[2]); // 用中等补
    else if (easy.length > 2) selected.push(easy[2]);

    // 补足4道（如果不够）
    var allAvail = easy.concat(medium).concat(hard);
    for (var i = 0; selected.length < DP_PER_DAY && i < allAvail.length; i++) {
      if (selected.indexOf(allAvail[i]) < 0) selected.push(allAvail[i]);
    }

    // 标记题库中的题目为已分配
    selected.forEach(function(p) {
      var bp = problemBank.find(function(x) { return x.id === p.id; });
      if (bp) { bp.assigned = true; bp.assignedDate = td; }
    });
    saveBank();

    dailyPractice[td] = {
      assigned: selected.map(function(p) { return p.id; }),
      completed: [],
      allDone: false
    };
    saveDaily();

    return dailyPractice[td];
  }

  // ===== 获取日期对应的题目详情 =====
  function getProblemsForDate(dateStr) {
    var rec = dailyPractice[dateStr];
    if (!rec || !rec.assigned) return [];
    return rec.assigned.map(function(id) {
      return problemBank.find(function(p) { return p.id === id; });
    }).filter(Boolean);
  }

  // ===== 完成/取消完成 =====
  function toggleProblem(problemId) {
    var td = today();
    var rec = dailyPractice[td];
    if (!rec) return;

    var idx = rec.completed.indexOf(problemId);
    if (idx >= 0) {
      rec.completed.splice(idx, 1);
    } else {
      rec.completed.push(problemId);
    }
    rec.allDone = rec.assigned.every(function(id) { return rec.completed.indexOf(id) >= 0; });
    saveDaily();
    renderDailyPanel();
  }

  // ===== 渲染每日刷题面板 =====
  function renderDailyPanel() {
    var td = today();
    var rec = dailyPractice[td];
    if (!rec && td >= DP_START_DATE) {
      rec = generateToday();
    }

    var problems = rec ? getProblemsForDate(td) : [];
    var completedIds = rec ? (rec.completed || []) : [];
    var doneCount = completedIds.length;
    var totalCount = problems.length;
    var allDone = totalCount > 0 && doneCount >= totalCount;

    // Badge
    var badge = document.getElementById('dpBadge');
    if (!badge) return;
    if (td < DP_START_DATE) {
      badge.textContent = '5月21日开始';
      badge.style.background = '#f4f4f5'; badge.style.color = '#71717a';
    } else if (allDone) {
      badge.textContent = '今日完成';
      badge.style.background = '#f0fdf4'; badge.style.color = '#16a34a';
    } else if (totalCount === 0) {
      badge.textContent = '题库已刷完';
      badge.style.background = '#fffbeb'; badge.style.color = '#b45309';
    } else {
      badge.textContent = (totalCount - doneCount) + ' 题待刷';
      badge.style.background = '#ecfdf5'; badge.style.color = '#059669';
    }

    // 日期
    var dateLabel = document.getElementById('dpDateLabel');
    if (dateLabel) dateLabel.textContent = formatDateCN(td);

    // 进度条
    var progressText = document.getElementById('dpProgressText');
    if (progressText) {
      progressText.textContent = totalCount > 0
        ? doneCount + ' / ' + totalCount + ' 已完成'
        : (td < DP_START_DATE ? '倒计时：5月21日开始每日刷题' : '所有题目已分配完毕，太强了！');
    }
    var progressFill = document.getElementById('dpProgressFill');
    if (progressFill) {
      var pct = totalCount > 0 ? Math.round(doneCount / totalCount * 100) : (totalCount === 0 && td >= DP_START_DATE ? 100 : 0);
      progressFill.style.width = pct + '%';
      progressFill.className = 'dp-progress-fill' + (allDone ? ' done' : '');
    }

    // 题目列表
    var container = document.getElementById('dpProblems');
    if (!container) return;

    if (td < DP_START_DATE) {
      container.innerHTML = '<div class="dp-empty"><span class="emoji">⏳</span>每日刷题将于 2026年5月21日 开启<br><small>题库已就绪：11~16届蓝桥杯国赛B组C++ 共60道真题</small></div>';
    } else if (totalCount === 0 && td >= DP_START_DATE) {
      container.innerHTML = '<div class="dp-done-celebrate"><span class="emoji">🎉</span><div class="msg">题库全部刷完！</div></div>';
    } else if (allDone) {
      container.innerHTML = '<div class="dp-done-celebrate"><span class="emoji">✅</span><div class="msg">今日刷题全部完成！</div></div>';
    } else {
      container.innerHTML = problems.map(function(p) {
        var isDone = completedIds.indexOf(p.id) >= 0;
        var diffClass = '';
        if (/简单/.test(p.difficulty)) diffClass = 'easy';
        else if (/中等/.test(p.difficulty)) diffClass = 'medium';
        else diffClass = 'hard';

        return '<div class="dp-card' + (isDone ? ' done checked' : '') + '" data-pid="' + p.id + '">' +
          '<input type="checkbox" class="dp-checkbox" ' + (isDone ? 'checked' : '') + ' title="勾选表示已完成">' +
          '<span class="dp-contest">' + p.year + '</span>' +
          '<div class="dp-info">' +
            (p.url
              ? '<a class="dp-title-text" href="' + p.url + '" target="_blank" title="' + p.title + '">' + p.title + '</a>'
              : '<span class="dp-title-text" title="' + p.title + '">' + p.title + '</span>') +
            '<div class="dp-meta">' +
              '<span class="dp-diff ' + diffClass + '">' + p.difficulty + '</span>' +
              '<span style="font-size:10px;color:#94a3b8">' + (p.tags || []).join(', ') + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    // 提交按钮
    var submitWrap = document.getElementById('dpSubmitWrap');
    if (submitWrap) {
      if (totalCount > 0 && !allDone) {
        submitWrap.style.display = 'flex';
        var submitBtn = document.getElementById('btnDpSubmit');
        if (submitBtn) {
          submitBtn.disabled = doneCount === 0;
          submitBtn.textContent = doneCount > 0 ? '✓ 提交今日刷题（' + doneCount + ' 题）' : '✓ 提交今日刷题';
        }
      } else {
        submitWrap.style.display = 'none';
      }
    }
  }

  // ===== 事件绑定 =====
  // 折叠
  var dpExpanded = true;
  document.getElementById('btnDpToggle').addEventListener('click', function() {
    dpExpanded = !dpExpanded;
    var body = document.getElementById('dpBody');
    if (dpExpanded) {
      body.classList.remove('collapsed');
      document.getElementById('btnDpToggle').textContent = '−';
    } else {
      body.classList.add('collapsed');
      document.getElementById('btnDpToggle').textContent = '+';
    }
  });

  // checkbox 变化
  document.getElementById('dpProblems').addEventListener('change', function(e) {
    if (!e.target.classList.contains('dp-checkbox')) return;
    var card = e.target.closest('.dp-card');
    if (!card) return;
    var pid = card.dataset.pid;
    if (pid) toggleProblem(pid);
  });

  // 提交按钮
  document.getElementById('btnDpSubmit').addEventListener('click', function() {
    var td = today();
    var rec = dailyPractice[td];
    if (!rec || rec.allDone) return;

    // 标记所有勾选的为完成
    var checkboxes = document.querySelectorAll('#dpProblems .dp-checkbox:checked');
    checkboxes.forEach(function(cb) {
      var card = cb.closest('.dp-card');
      if (card && card.dataset.pid) {
        var pid = card.dataset.pid;
        if (rec.completed.indexOf(pid) < 0) rec.completed.push(pid);
      }
    });
    rec.allDone = rec.assigned.every(function(id) { return rec.completed.indexOf(id) >= 0; });
    saveDaily();
    renderDailyPanel();
  });

  // ===== 初始化 =====
  function initDailyPractice() {
    initBank();
    loadDaily();

    // 生成今日任务
    var td = today();
    if (td >= DP_START_DATE && (!dailyPractice[td] || dailyPractice[td].assigned.length === 0)) {
      generateToday();
    }

    renderDailyPanel();
  }

  // 暴露到全局
  window.initDailyPractice = initDailyPractice;
  window.renderDailyPanel = renderDailyPanel;

  // 切换日期时刷新
  var origDPGoToDate = goToDate;
  goToDate = function(dateStr) {
    origDPGoToDate(dateStr);
    if (typeof renderDailyPanel === 'function') renderDailyPanel();
  };
})();


// ============ 模板空间系统 ============
(function() {
  var TPL_KEY = 'code_templates';

  var CATEGORIES = ['搜索', '动态规划', '数据结构', '图论', '数学/数论', '字符串', '贪心', '其他'];
  var templates = [];
  var activeCategory = '全部';
  var editingId = null;
  var searchTerm = '';

  function load() {
    try { templates = JSON.parse(localStorage.getItem(TPL_KEY)) || []; }
    catch(e) { templates = []; }
  }
  function save() { localStorage.setItem(TPL_KEY, JSON.stringify(templates)); }

  function getCounts() {
    var cnt = {};
    CATEGORIES.forEach(function(c) { cnt[c] = 0; });
    templates.forEach(function(t) {
      if (cnt[t.category] !== undefined) cnt[t.category]++;
    });
    return cnt;
  }

  function renderSidebar() {
    var container = document.getElementById('templateSidebar');
    if (!container) return;
    var counts = getCounts();
    var total = templates.length;

    var html = '<div class="template-cat' + (activeCategory === '全部' ? ' active' : '') + '" data-cat="全部">全部<span class="count">' + total + '</span></div>';
    CATEGORIES.forEach(function(c) {
      html += '<div class="template-cat' + (activeCategory === c ? ' active' : '') + '" data-cat="' + c + '">' + c + '<span class="count">' + (counts[c] || 0) + '</span></div>';
    });
    container.innerHTML = html;

    container.querySelectorAll('.template-cat').forEach(function(el) {
      el.addEventListener('click', function() {
        activeCategory = this.dataset.cat;
        editingId = null;
        searchTerm = '';
        var s = document.getElementById('templateSearch');
        if (s) s.value = '';
        renderAll();
      });
    });
  }

  function getFiltered() {
    var result = templates;
    if (activeCategory !== '全部') result = result.filter(function(t) { return t.category === activeCategory; });
    if (searchTerm) {
      var kw = searchTerm.toLowerCase();
      result = result.filter(function(t) {
        return t.name.toLowerCase().indexOf(kw) >= 0 ||
               (t.notes && t.notes.toLowerCase().indexOf(kw) >= 0) ||
               t.category.toLowerCase().indexOf(kw) >= 0;
      });
    }
    return result;
  }

  function escHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderList() {
    var container = document.getElementById('templateList');
    var countEl = document.getElementById('templateCount');
    if (!container) return;

    var filtered = getFiltered();
    if (countEl) countEl.textContent = filtered.length + ' 个模板';

    if (filtered.length === 0) {
      container.innerHTML = '<div class="template-empty"><span class="emoji">📋</span>该分类还没有模板<br><small>点击下方按钮添加</small></div>';
      return;
    }

    container.innerHTML = filtered.map(function(tpl) {
      return '<div class="template-card" data-id="' + tpl.id + '">' +
        '<button class="template-card-del" data-action="del" data-id="' + tpl.id + '" title="删除">×</button>' +
        '<div class="template-card-header">' +
          '<span class="template-card-name">' + escHtml(tpl.name) + '</span>' +
          '<span class="template-card-lang">' + escHtml(tpl.language) + '</span>' +
          '<button class="template-card-edit" data-action="edit" data-id="' + tpl.id + '">编辑</button>' +
        '</div>' +
        '<div class="template-card-code" data-expand="0">' + escHtml(tpl.code) + '</div>' +
        (tpl.notes ? '<div class="template-card-notes">' + escHtml(tpl.notes) + '</div>' : '') +
      '</div>';
    }).join('');

    // 点击代码区 → 展开/折叠
    container.querySelectorAll('.template-card-code').forEach(function(codeEl) {
      codeEl.addEventListener('click', function(e) {
        e.stopPropagation();
        this.classList.toggle('expanded');
      });
    });

    // 编辑按钮
    container.querySelectorAll('.template-card-edit').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var id = this.dataset.id;
        var tpl = templates.find(function(t) { return t.id === id; });
        if (tpl) editTemplate(tpl);
      });
    });

    // 点击卡片空白区也展开
    container.querySelectorAll('.template-card').forEach(function(card) {
      card.addEventListener('click', function(e) {
        if (e.target.dataset.action === 'del' || e.target.dataset.action === 'edit') return;
        if (e.target.closest('.template-card-code')) return;
        var codeEl = card.querySelector('.template-card-code');
        if (codeEl) codeEl.classList.toggle('expanded');
      });
    });

    container.querySelectorAll('.template-card-del').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var id = this.dataset.id;
        if (confirm('确定删除这个模板？')) {
          templates = templates.filter(function(t) { return t.id !== id; });
          save();
          editingId = null;
          renderAll();
        }
      });
    });
  }

  function renderForm() {
    var container = document.getElementById('templateList');
    var countEl = document.getElementById('templateCount');
    if (!container) return;

    var tpl = null;
    if (editingId) {
      tpl = templates.find(function(t) { return t.id === editingId; });
    }

    var name = tpl ? escHtml(tpl.name) : '';
    var lang = tpl ? tpl.language : 'C++';
    var cat = tpl ? tpl.category : (activeCategory !== '全部' ? activeCategory : '搜索');
    var code = tpl ? escHtml(tpl.code) : '';
    var notes = tpl ? escHtml(tpl.notes) : '';

    if (countEl) countEl.textContent = editingId ? '编辑模板' : '新建模板';

    var catOptions = CATEGORIES.map(function(c) {
      return '<option value="' + c + '"' + (cat === c ? ' selected' : '') + '>' + c + '</option>';
    }).join('');

    container.innerHTML =
      '<div class="template-form">' +
        '<div class="template-form-row">' +
          '<input type="text" id="tplName" placeholder="模板名称" value="' + name + '">' +
          '<select id="tplLang"><option' + (lang === 'C++' ? ' selected' : '') + '>C++</option><option' + (lang === 'Python' ? ' selected' : '') + '>Python</option><option' + (lang === 'Java' ? ' selected' : '') + '>Java</option><option' + (lang === 'JavaScript' ? ' selected' : '') + '>JavaScript</option></select>' +
          '<select id="tplCat">' + catOptions + '</select>' +
        '</div>' +
        '<textarea class="tpl-code-area" id="tplCode" placeholder="粘贴代码模板...">' + code + '</textarea>' +
        '<textarea class="tpl-notes-area" id="tplNotes" placeholder="备注/使用场景（可选）">' + notes + '</textarea>' +
        '<div class="template-form-actions">' +
          '<button class="btn-tpl-cancel" id="btnTplCancel">取消</button>' +
          '<button class="btn-tpl-save" id="btnTplSave">' + (editingId ? '保存修改' : '添加模板') + '</button>' +
        '</div>' +
      '</div>';

    document.getElementById('btnTplSave').addEventListener('click', saveTemplate);
    document.getElementById('btnTplCancel').addEventListener('click', function() {
      editingId = null;
      renderAll();
    });
    document.getElementById('tplName').focus();

    document.getElementById('tplCode').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && e.ctrlKey) saveTemplate();
    });
  }

  function saveTemplate() {
    var name = document.getElementById('tplName').value.trim();
    var lang = document.getElementById('tplLang').value;
    var cat = document.getElementById('tplCat').value;
    var code = document.getElementById('tplCode').value.trim();
    var notes = document.getElementById('tplNotes').value.trim();

    if (!name) { alert('请输入模板名称'); return; }
    if (!code) { alert('请粘贴代码'); return; }

    if (editingId) {
      var idx = templates.findIndex(function(t) { return t.id === editingId; });
      if (idx >= 0) {
        templates[idx].name = name;
        templates[idx].language = lang;
        templates[idx].category = cat;
        templates[idx].code = code;
        templates[idx].notes = notes;
      }
    } else {
      templates.push({
        id: 'tpl_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 5),
        name: name,
        language: lang,
        category: cat,
        code: code,
        notes: notes,
        createdAt: new Date().toISOString().slice(0, 10)
      });
    }

    save();
    editingId = null;
    activeCategory = cat;
    renderAll();
  }

  function editTemplate(tpl) {
    editingId = tpl.id;
    activeCategory = '全部';
    renderSidebar();
    renderForm();
  }

  function renderAll() {
    renderSidebar();
    var filtered = getFiltered();
    var container = document.getElementById('templateList');
    var countEl = document.getElementById('templateCount');
    if (!editingId) {
      // 只在非编辑态显示列表+添加按钮
      if (countEl) countEl.textContent = filtered.length + ' 个模板';
      if (filtered.length === 0) {
        container.innerHTML = '<div class="template-empty"><span class="emoji">📋</span>该分类还没有模板<br><small>点击下方按钮添加</small></div>';
      } else {
        renderList();
      }
      renderAddBtn();
    }
  }

  function renderAddBtn() {
    var container = document.getElementById('templateList');
    if (!container) return;
    if (editingId) return;

    var existing = container.querySelector('.template-add-btn');
    if (existing) existing.remove();

    var btn = document.createElement('div');
    btn.className = 'template-add-btn';
    btn.innerHTML = '+ 新建模板';
    btn.addEventListener('click', function() {
      editingId = null;
      renderAll();
      renderForm();
    });
    container.appendChild(btn);
  }

  // ===== 自动从笔记提取模板 =====
  function autoExtractFromNotes() {
    if (templates.length > 0) return; // 已有模板则跳过
    var allNotes = loadAllNotes();
    var dates = Object.keys(allNotes).sort();
    var imported = 0;

    dates.forEach(function(ds) {
      var md = allNotes[ds];
      var cardRe = /<div class="problem-card">([\s\S]*?)<\/div>/g;
      var match;
      while ((match = cardRe.exec(md)) !== null) {
        var block = match[1];
        // 提取标题
        var titleMatch = block.match(/##\s*(.+)/);
        var title = titleMatch ? titleMatch[1].trim().replace(/^P?\d+[\.\s]+/, '') : '';
        // 提取标签
        var tagsMatch = block.match(/\*\*标签\*\*\s*\|\s*(.+)/);
        var tags = tagsMatch ? tagsMatch[1].split(/[,，]/).map(function(t) { return t.trim(); }) : [];
        // 提取第一个代码块
        var codeMatch = block.match(/```(\w+)?\n([\s\S]*?)```/);
        var lang = codeMatch && codeMatch[1] ? codeMatch[1] : 'cpp';
        var code = codeMatch ? codeMatch[2].trim() : '';

        // 判断是否为模板：标签包含"模板" 或 标题包含"模板"
        var isTemplate = false;
        for (var i = 0; i < tags.length; i++) {
          if (tags[i].indexOf('模板') >= 0) { isTemplate = true; break; }
        }
        if (!isTemplate && title.indexOf('模板') >= 0) isTemplate = true;
        if (!isTemplate) continue;
        if (!code) continue;

        // 推断分类
        var cat = guessCategory(title, tags, code);
        // 归一化语言名
        var langMap = { cpp: 'C++', python: 'Python', py: 'Python', java: 'Java', javascript: 'JavaScript', js: 'JavaScript', typescript: 'JavaScript', ts: 'JavaScript' };
        var langDisplay = langMap[lang.toLowerCase()] || 'C++';

        // 避免重复
        var dup = templates.find(function(t) { return t.name === title; });
        if (dup) continue;

        templates.push({
          id: 'tpl_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 5),
          name: title,
          language: langDisplay,
          category: cat,
          code: code,
          notes: '从 ' + ds + ' 笔记自动导入',
          createdAt: ds
        });
        imported++;
      }
    });

    if (imported > 0) {
      save();
      console.log('模板空间: 从笔记自动导入了 ' + imported + ' 个模板');
    }
  }

  function guessCategory(title, tags, code) {
    var text = (title + ' ' + tags.join(' ') + ' ' + code.slice(0, 500)).toLowerCase();
    if (/搜索|dfs|bfs|回溯|全排列|组合|枚举|剪枝/.test(text)) return '搜索';
    if (/dp|动态规划|背包|lis|lcs|状态|转移|线性dp|区间dp|数位dp/.test(text)) return '动态规划';
    if (/树|堆|栈|队列|链表|并查集|trie|线段树|树状数组|哈希|前缀和|差分/.test(text)) return '数据结构';
    if (/图|最短|dijkstra|floyd|拓扑|tarjan|连通|生成树|网络流|二分图/.test(text)) return '图论';
    if (/数学|数论|质数|gcd|lcm|快速幂|逆元|组合|素数|因数/.test(text)) return '数学/数论';
    if (/字符串|kmp|trie|ac自动机|回文|后缀|字典树|哈希/.test(text)) return '字符串';
    if (/贪心|排序|二分|双指针|滑动窗口/.test(text)) return '贪心';
    return '其他';
  }

  // ===== 弹窗控制 =====
  function openModal() {
    load();
    editingId = null;
    activeCategory = '全部';
    searchTerm = '';
    autoExtractFromNotes(); // 首次打开自动扫描导入
    renderAll();
    document.getElementById('templateOverlay').classList.add('show');
    // 搜索框聚焦 + 事件
    var s = document.getElementById('templateSearch');
    if (s) { s.value = ''; s.focus(); }
  }
  function closeModal() {
    document.getElementById('templateOverlay').classList.remove('show');
  }

  // ===== 事件绑定 =====
  document.getElementById('sfTemplate').addEventListener('click', openModal);
  document.getElementById('templateClose').addEventListener('click', closeModal);
  document.getElementById('templateOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('templateOverlay').classList.contains('show')) {
      closeModal();
    }
  });

  // 搜索框输入实时过滤
  var searchInput = document.getElementById('templateSearch');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      searchTerm = this.value.trim();
      editingId = null;
      renderAll();
    });
  }
})();


// ============ 全局搜索 ============
(function() {
  var searchInput = document.getElementById('globalSearch');
  var dropdown = document.getElementById('searchDropdown');
  if (!searchInput || !dropdown) return;

  var searchCache = null; // { title, date, tags, cardIndex }
  var debounceTimer = null;

  function buildIndex() {
    var allNotes = loadAllNotes();
    var index = [];
    Object.keys(allNotes).sort().reverse().forEach(function(ds) {
      var md = allNotes[ds];
      var cardRe = /<div class="problem-card">([\s\S]*?)<\/div>/g;
      var match;
      while ((match = cardRe.exec(md)) !== null) {
        var block = match[1];
        var titleMatch = block.match(/##\s*(.+)/);
        var title = titleMatch ? titleMatch[1].trim().replace(/^P?\d+[\.\s]+/, '') : '';
        var tagsMatch = block.match(/\*\*标签\*\*\s*\|\s*(.+)/);
        var tags = tagsMatch ? tagsMatch[1].split(/[,，]/).map(function(t){return t.trim();}) : [];
        if (title) {
          index.push({ title: title, date: ds, tags: tags });
        }
      }
    });
    return index;
  }

  function showDropdown(items) {
    if (items.length === 0) {
      dropdown.innerHTML = '<div class="search-empty">没有找到匹配的题目</div>';
    } else {
      dropdown.innerHTML = items.map(function(item) {
        var tagsHtml = '';
        if (item.tags.length > 0) {
          tagsHtml = '<div class="si-tags">' + item.tags.slice(0, 4).map(function(t) { return '<span>' + escHtml2(t) + '</span>'; }).join('') + '</div>';
        }
        return '<div class="search-item" data-date="' + item.date + '" data-title="' + escHtml2(item.title) + '">' +
          '<div class="si-title">' + escHtml2(item.title) + '</div>' +
          '<div class="si-date">' + formatDateCN(item.date) + '</div>' +
          tagsHtml +
        '</div>';
      }).join('');
    }
    dropdown.style.display = 'block';
  }

  function escHtml2(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  searchInput.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    var kw = this.value.trim();
    if (!kw) { dropdown.style.display = 'none'; return; }
    debounceTimer = setTimeout(function() {
      if (!searchCache) searchCache = buildIndex();
      var kwLower = kw.toLowerCase();
      var results = searchCache.filter(function(item) {
        return item.title.toLowerCase().indexOf(kwLower) >= 0 ||
               item.tags.some(function(t) { return t.toLowerCase().indexOf(kwLower) >= 0; });
      }).slice(0, 15);
      showDropdown(results);
    }, 200);
  });

  searchInput.addEventListener('focus', function() {
    if (this.value.trim() && dropdown.innerHTML) dropdown.style.display = 'block';
  });

  // 点击结果跳转
  dropdown.addEventListener('click', function(e) {
    var item = e.target.closest('.search-item');
    if (!item) return;
    var ds = item.dataset.date;
    if (ds) {
      goToDate(ds);
      dropdown.style.display = 'none';
      searchInput.value = '';
    }
  });

  // 点击外部关闭
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.topbar-search')) dropdown.style.display = 'none';
  });

  // 输入时重建索引（有新题目时）
  window.refreshSearchIndex = function() { searchCache = null; };
})();

// ============ 分类浏览系统 ============
(function() {
  var overlay = document.getElementById('categoryBrowseOverlay');
  var sidebar = document.getElementById('tagSidebar');
  var listEl = document.getElementById('tagProblemList');
  var countEl = document.getElementById('tagSearchCount');
  if (!overlay || !sidebar || !listEl) return;

  var CATEGORIES = ['搜索', '动态规划', '数据结构', '图论', '数学/数论', '字符串', '贪心', '其他'];
  var activeCategory = '全部';
  var allProblems = [];

  function guessCategory(title, tags) {
    // 先检查标签里是否直接包含分类名
    for (var i = 0; i < tags.length; i++) {
      var t = tags[i];
      for (var j = 0; j < CATEGORIES.length; j++) {
        if (t === CATEGORIES[j]) return CATEGORIES[j];
      }
    }
    var text = (title + ' ' + tags.join(' ')).toLowerCase();
    if (/搜索|dfs|bfs|回溯|全排列|组合|枚举|剪枝/.test(text)) return '搜索';
    if (/dp|动态规划|背包|lis|lcs|状态|转移|线性dp|区间dp|数位dp|记忆化/.test(text)) return '动态规划';
    if (/树|堆|栈|队列|链表|并查集|trie|线段树|树状数组|哈希|前缀和|差分/.test(text)) return '数据结构';
    if (/图|最短|dijkstra|floyd|拓扑|tarjan|连通|生成树|网络流|二分图/.test(text)) return '图论';
    if (/数学|数论|质数|gcd|lcm|快速幂|逆元|组合|素数|因数/.test(text)) return '数学/数论';
    if (/字符串|kmp|ac自动机|回文|后缀|字典树/.test(text)) return '字符串';
    if (/贪心|排序|二分|双指针|滑动窗口/.test(text)) return '贪心';
    return '其他';
  }

  function buildIndex() {
    var allNotes = loadAllNotes();
    allProblems = [];
    Object.keys(allNotes).sort().reverse().forEach(function(ds) {
      var md = allNotes[ds];
      var cardRe = /<div class="problem-card">([\s\S]*?)<\/div>/g;
      var match;
      while ((match = cardRe.exec(md)) !== null) {
        var block = match[1];
        var titleMatch = block.match(/##\s*(.+)/);
        var title = titleMatch ? titleMatch[1].trim().replace(/^P?\d+[\.\s]+/, '') : '';
        if (!title) continue;

        var tagsMatch = block.match(/\*\*标签\*\*\s*\|\s*(.+)/);
        var tags = tagsMatch ? tagsMatch[1].split(/[,，]/).map(function(t){return t.trim();}).filter(Boolean) : [];

        var platMatch = block.match(/\*\*平台\*\*\s*\|\s*(.+)/);
        var platform = platMatch ? platMatch[1].trim() : '未知';

        var diffMatch = block.match(/\*\*难度\*\*\s*\|\s*(.+)/);
        var difficulty = diffMatch ? diffMatch[1].trim() : '中等';

        // 提取链接
        var url = '';
        var urlMatch = block.match(/\*\*链接\*\*\s*\|\s*\[.*\]\((https?:\/\/[^)]+)\)/);
        if (!urlMatch) urlMatch = block.match(/\[.*\]\((https?:\/\/[^)]+)\)/);
        if (urlMatch) url = urlMatch[1];

        var category = guessCategory(title, tags);

        allProblems.push({
          title: title,
          date: ds,
          tags: tags,
          platform: platform,
          difficulty: difficulty,
          url: url,
          category: category
        });
      }
    });
  }

  function getPlatformColor(platform) {
    var colors = { '蓝桥杯': '#3b82f6', '力扣': '#ef4444', '洛谷': '#8b5cf6', '牛客': '#10b981', 'Codeforces': '#f59e0b' };
    for (var key in colors) {
      if (platform.indexOf(key) >= 0) return colors[key];
    }
    return '#6b7280';
  }

  function getDifficultyColor(diff) {
    var c = { '简单': '#10b981', '中等': '#f59e0b', '困难': '#ef4444' };
    return c[diff] || '#6b7280';
  }

  function getCounts() {
    var cnt = {};
    CATEGORIES.forEach(function(c) { cnt[c] = 0; });
    allProblems.forEach(function(p) {
      if (cnt[p.category] !== undefined) cnt[p.category]++;
    });
    return cnt;
  }

  function renderSidebar() {
    var counts = getCounts();
    var total = allProblems.length;
    var html = '<div class="template-cat' + (activeCategory === '全部' ? ' active' : '') + '" data-cat="全部">全部<span class="count">' + total + '</span></div>';
    CATEGORIES.forEach(function(c) {
      html += '<div class="template-cat' + (activeCategory === c ? ' active' : '') + '" data-cat="' + c + '">' + c + '<span class="count">' + (counts[c] || 0) + '</span></div>';
    });
    sidebar.innerHTML = html;

    sidebar.querySelectorAll('.template-cat').forEach(function(el) {
      el.addEventListener('click', function() {
        activeCategory = this.dataset.cat;
        renderAll();
      });
    });
  }

  function renderProblemList() {
    var filtered = activeCategory === '全部'
      ? allProblems
      : allProblems.filter(function(p) { return p.category === activeCategory; });

    countEl.textContent = '共 ' + filtered.length + ' 道题目';

    if (filtered.length === 0) {
      listEl.innerHTML = '<div style="text-align:center;color:#9ca3af;padding:40px;">暂无题目</div>';
      return;
    }

    listEl.innerHTML = filtered.map(function(p) {
      return '<div class="tag-problem" data-date="' + p.date + '">' +
        '<span class="tp-platform-tag" style="background:' + getPlatformColor(p.platform) + '">' + escHtml3(p.platform) + '</span>' +
        '<span class="tp-title-tag">' + escHtml3(p.title) + '</span>' +
        '<span class="tp-diff-tag" style="background:' + getDifficultyColor(p.difficulty) + '20;color:' + getDifficultyColor(p.difficulty) + '">' + escHtml3(p.difficulty) + '</span>' +
        '<span class="tp-date-tag">' + formatDateCN(p.date) + '</span>' +
      '</div>';
    }).join('');

    listEl.querySelectorAll('.tag-problem').forEach(function(el) {
      el.addEventListener('click', function() {
        var dateStr = this.dataset.date;
        closeModal();
        goToDate(dateStr);
      });
    });
  }

  function escHtml3(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderAll() {
    renderSidebar();
    renderProblemList();
  }

  function openModal() {
    buildIndex();
    activeCategory = '全部';
    renderAll();
    overlay.classList.add('show');
  }

  function closeModal() {
    overlay.classList.remove('show');
  }

  document.getElementById('sfCategoryBrowse').addEventListener('click', openModal);
  document.getElementById('categoryBrowseClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('show')) {
      closeModal();
    }
  });
})();
